<script>
/* core\40_attendance.js */
/* Chấm công: M03, M04, M05, M11, W04 — FR-HR-01..08, CB-01..05, F-13..F-16. */

function openAttendance(employeeId) {
  return dbAll('Attendance', function (a) { return a.EmployeeID === employeeId && a.Status === 'open'; })[0] || null;
}

function shiftEndMs(att) {
  var st = dbGet('ShiftTypes', att.ShiftTypeID);
  if (!st) return parseTs(att.CheckInTime) + 12 * MS_HOUR;
  var end = tsOnBusinessDate(att.BusinessDate, st.EndTime);
  var start = tsOnBusinessDate(att.BusinessDate, st.StartTime);
  if (end <= start) end += MS_DAY;
  return end;
}

/* F-16: phút muộn = giờ vào − giờ bắt đầu ca, tối thiểu 0. */
function lateMinutesOf(businessDate, shiftTypeId, checkInMs) {
  var st = dbGet('ShiftTypes', shiftTypeId);
  if (!st || !st.StartTime) return 0;
  return Math.max(0, Math.round((checkInMs - tsOnBusinessDate(businessDate, st.StartTime)) / 60000));
}

/* F-15: giờ làm, làm tròn 15 phút. */
function workHoursOf(inMs, outMs) {
  if (isNaN(inMs) || isNaN(outMs) || outMs <= inMs) return 0;
  return Math.round((outMs - inMs) / (15 * 60000)) / 4;
}

function checkGps(location, reason) {
  var mode = settingStr('gpsMode'), check = mode === 'warn' || mode === 'block';
  if (!location || location.lat === undefined) return { ok: !check, text: 'không lấy được vị trí' + (reason ? ': ' + String(reason).slice(0, 80) : '') };
  var d = distanceM(+location.lat, +location.lng, settingNum('storeLat'), settingNum('storeLng'));
  return { ok: !check || d <= settingNum('gpsRadius'), text: 'cách quán ' + Math.round(d) + ' m', distance: d };
}

function locStr(location) {
  if (!location || location.lat === undefined) return '';
  return (+location.lat).toFixed(6) + ',' + (+location.lng).toFixed(6) + (location.acc ? ' ±' + Math.round(location.acc) + 'm' : '');
}

/* Giờ bấm thật khi app lưu tạm lúc mất mạng (NFR-04): chấp nhận nếu gửi lại trong 30 phút. */
function eventMs(p) {
  var now = nowMs(), t = toNum(p.offlineAt);
  if (t && t <= now && now - t <= 30 * 60000) return t;
  return now;
}

function assertMonthOpen(businessDate) {
  if (dbGet('PayrollPeriods', monthOf(businessDate))) fail('LOCKED_MONTH', 'Tháng ' + monthOf(businessDate) + ' đã chốt công, không sửa được.');
}

function checkIn(ctx, p) {
  var me = ctx.user.EmployeeID;
  if (openAttendance(me)) fail('CB-01', 'Bạn đang có ca chưa ra. Hãy bấm Ra ca trước khi vào ca mới.');
  var st = dbGet('ShiftTypes', p.shiftTypeId);
  if (!st || !toBool(st.IsActive)) fail('INPUT', 'Chọn loại ca');
  var warnings = [];
  var gps = checkGps(p.location, p.locationError);
  if (!gps.ok) {
    if (settingStr('gpsMode') === 'block') fail('CB-02', 'Bạn đang ở ngoài khu vực quán (' + gps.text + '). Không chấm công được.');
    warnings.push('CB-02: chấm công ngoài khu vực quán (' + gps.text + ')');
  }
  var now = eventMs(p), bd = businessDateOf(now);
  var late = lateMinutesOf(bd, st.ShiftTypeID, now);
  var row = dbInsert(ctx, 'Attendance', {
    AttendanceID: uid('A'), EmployeeID: me, ShiftTypeID: st.ShiftTypeID, BusinessDate: bd,
    CheckInTime: fmtTs(now), CheckInLocation: locStr(p.location), CheckInDistance: gps.distance === undefined ? '' : Math.round(gps.distance),
    LateMinutes: late, Status: 'open', Source: 'app',
    Note: now !== nowMs() ? 'Gửi lại sau khi mất mạng' : ''
  });
  if (!gps.ok) notify('CB-02', 'warn', ctx.user.DisplayName + ' vào ca ngoài khu vực quán (' + gps.text + ').', 'Attendance/' + row.AttendanceID, 'admin');
  if (late > settingNum('lateMinutes')) {
    warnings.push('CB-03: vào ca muộn ' + late + ' phút');
    notify('CB-03', 'warn', ctx.user.DisplayName + ' vào ca ' + st.Name + ' muộn ' + late + ' phút.', 'Attendance/' + row.AttendanceID, 'leader');
  }
  ensureBusinessDay(bd);
  return { attendance: attendanceView(row), warnings: warnings, distance: gps.distance === undefined ? null : Math.round(gps.distance), locationText: gps.text };
}

function checkOut(ctx, p) {
  var me = ctx.user.EmployeeID;
  var att = openAttendance(me);
  if (!att) fail('NO_OPEN', 'Bạn chưa vào ca.');
  var gps = checkGps(p.location, p.locationError);
  var warnings = [];
  if (!gps.ok) {
    if (settingStr('gpsMode') === 'block') fail('CB-02', 'Bạn đang ở ngoài khu vực quán (' + gps.text + '). Không chấm công được.');
    warnings.push('CB-02: ra ca ngoài khu vực quán (' + gps.text + ')');
  }
  // Ảnh hiện trạng bắt buộc trước khi ra ca; ảnh gửi lên dạng data URL được lưu vào Google Drive.
  var need = settingNum('checkoutPhotoCount');
  var photos = (p.photos || []).filter(function (x) { return x; });
  if (photos.length < need) fail('PHOTO', 'Chụp đủ ' + need + ' ảnh hiện trạng nhà hàng trước khi ra ca (mới có ' + photos.length + ').');
  var urls = photos.map(function (ph, i) {
    return String(ph).indexOf('data:') === 0 ? PLATFORM.saveImage(ph, 'RaCa_' + me + '_' + (i + 1)) : ph;
  });
  var now = eventMs(p);
  if (now <= parseTs(att.CheckInTime)) now = nowMs();
  var hours = workHoursOf(parseTs(att.CheckInTime), now);
  var status = 'done';
  if (hours < settingNum('minShiftHours') || hours > settingNum('maxShiftHours')) {
    status = 'review';
    warnings.push('CB-05: lượt làm ' + hours + ' giờ, cần trưởng ca duyệt');
    notify('CB-05', 'warn', ctx.user.DisplayName + ' có lượt làm ' + hours + ' giờ ngày ' + fmtDateVN(att.BusinessDate) + ', cần duyệt.', 'Attendance/' + att.AttendanceID, 'leader');
  }
  var row = dbUpdate(ctx, 'Attendance', att.AttendanceID, {
    CheckOutTime: fmtTs(now), CheckOutLocation: locStr(p.location), CheckOutDistance: gps.distance === undefined ? '' : Math.round(gps.distance),
    CheckoutPhotos: urls.join(' '), WorkHours: hours, Status: status
  });
  if (!gps.ok) notify('CB-02', 'warn', ctx.user.DisplayName + ' ra ca ngoài khu vực quán (' + gps.text + ').', 'Attendance/' + att.AttendanceID, 'admin');
  if (ctx.user.IsCashier) {
    var close = closingCheckpoint();
    var bd = att.BusinessDate;
    var hasClose = close && dbAll('ShiftReports', function (r) { return r.BusinessDate === bd && r.CheckpointID === close.CheckpointID && r.Status !== 'draft'; }).length > 0;
    var others = dbAll('Attendance', function (a) { return a.BusinessDate === bd && a.Status === 'open' && a.EmployeeID !== me; });
    if (close && !hasClose && others.length === 0) warnings.push('Chưa có báo cáo Cuối ngày cho ngày ' + fmtDateVN(bd) + '.');
  }
  return { attendance: attendanceView(row), warnings: warnings, distance: gps.distance === undefined ? null : Math.round(gps.distance), locationText: gps.text };
}

/* Nhân viên đã bấm 'Gửi vào nhóm Zalo' (phương án C – chia sẻ thủ công). App không biết chắc tin đã gửi,
 * chỉ ghi nhận đã mở màn hình chia sẻ để chủ quán đối chiếu với nhóm Zalo. */
function markShared(ctx, p) {
  var a = dbGet('Attendance', p.attendanceId);
  if (!a || a.EmployeeID !== ctx.user.EmployeeID) fail('NOT_FOUND', 'Không tìm thấy lượt chấm công');
  var patch = {};
  patch[p.kind === 'out' ? 'SharedOut' : 'SharedIn'] = nowTs();
  dbUpdate(ctx, 'Attendance', a.AttendanceID, patch);
  return true;
}

/* W10 Nhật ký ca: vị trí, ảnh hiện trạng, đã bấm chia sẻ Zalo hay chưa. */
function shiftLog(ctx, p) {
  var from = p.from || addDays(currentBusinessDate(), -6), to = p.to || currentBusinessDate();
  return dbAll('Attendance', function (a) {
    return a.BusinessDate >= from && a.BusinessDate <= to && (!p.employeeId || a.EmployeeID === p.employeeId) && a.Source !== 'import';
  }).map(attendanceView).sort(function (a, b) { return String(b.CheckInTime || b.CheckOutTime).localeCompare(String(a.CheckInTime || a.CheckOutTime)); });
}

/* M05: yêu cầu bổ sung công. */
function requestAttendance(ctx, p) {
  var me = ctx.user.EmployeeID;
  var bd = String(p.businessDate || '');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(bd)) fail('INPUT', 'Chọn ngày');
  var today = currentBusinessDate();
  var days = Math.round((parseTs(today) - parseTs(bd)) / MS_DAY);
  if (days < 0 || days > settingNum('attendanceRequestDays')) fail('INPUT', 'Chỉ được báo thiếu công trong ' + settingNum('attendanceRequestDays') + ' ngày gần nhất');
  assertMonthOpen(bd);
  var st = dbGet('ShiftTypes', p.shiftTypeId);
  if (!st) fail('INPUT', 'Chọn loại ca');
  if (!p.reason || !String(p.reason).trim()) fail('INPUT', 'Nhập lý do');
  var inMs = p.checkIn ? tsOnBusinessDate(bd, p.checkIn) : NaN;
  var outMs = p.checkOut ? tsOnBusinessDate(bd, p.checkOut) : NaN;
  if (isNaN(inMs)) fail('INPUT', 'Nhập giờ vào');
  if (!isNaN(outMs) && outMs <= inMs) outMs += MS_DAY;
  var dup = dbAll('Attendance', function (a) {
    return a.EmployeeID === me && a.BusinessDate === bd && a.ShiftTypeID === st.ShiftTypeID && a.Status !== 'rejected';
  });
  var target = dup.filter(function (a) { return a.Status === 'review' || a.Status === 'open'; })[0];
  if (dup.length && !target) fail('DUP', 'Ngày này đã có lượt ' + st.Name + '. Nếu sai giờ, nhờ trưởng ca sửa.');
  var fields = {
    CheckInTime: fmtTs(inMs), CheckOutTime: isNaN(outMs) ? '' : fmtTs(outMs),
    WorkHours: workHoursOf(inMs, outMs), LateMinutes: lateMinutesOf(bd, st.ShiftTypeID, inMs),
    Status: 'pending', RequestReason: String(p.reason).trim()
  };
  var row;
  if (target) row = dbUpdate(ctx, 'Attendance', target.AttendanceID, fields);
  else {
    fields.AttendanceID = uid('A'); fields.EmployeeID = me; fields.ShiftTypeID = st.ShiftTypeID; fields.BusinessDate = bd; fields.Source = 'request';
    row = dbInsert(ctx, 'Attendance', fields);
  }
  notify('REQ', 'remind', ctx.user.DisplayName + ' báo thiếu công ngày ' + fmtDateVN(bd) + ' (' + st.Name + ').', 'Attendance/' + row.AttendanceID, 'leader');
  return row;
}

function attendanceView(a) {
  var st = dbGet('ShiftTypes', a.ShiftTypeID);
  return {
    AttendanceID: a.AttendanceID, EmployeeID: a.EmployeeID, EmployeeName: employeeName(a.EmployeeID),
    ShiftTypeID: a.ShiftTypeID, ShiftName: st ? st.Name : a.ShiftTypeID, BusinessDate: a.BusinessDate,
    CheckInTime: a.CheckInTime, CheckOutTime: a.CheckOutTime, WorkHours: toNum(a.WorkHours), LateMinutes: toNum(a.LateMinutes),
    Status: a.Status, StatusName: ATT_STATUS[a.Status] || a.Status, Source: a.Source, RequestReason: a.RequestReason,
    CheckInLocation: a.CheckInLocation, CheckOutLocation: a.CheckOutLocation, Note: a.Note,
    CheckInDistance: a.CheckInDistance === '' ? null : toNum(a.CheckInDistance), CheckOutDistance: a.CheckOutDistance === '' ? null : toNum(a.CheckOutDistance),
    CheckoutPhotos: String(a.CheckoutPhotos || '').split(' ').filter(String), SharedIn: a.SharedIn, SharedOut: a.SharedOut
  };
}

function myAttendance(ctx, p) {
  var month = p.month || monthOf(currentBusinessDate());
  var rows = dbAll('Attendance', function (a) { return a.EmployeeID === ctx.user.EmployeeID && monthOf(a.BusinessDate) === month; })
    .sort(function (a, b) { return String(b.CheckInTime || b.BusinessDate).localeCompare(String(a.CheckInTime || a.BusinessDate)); });
  var summary = attendanceSummary(month, ctx.user.EmployeeID)[0] || null;
  return { month: month, rows: rows.map(attendanceView), summary: summary, shiftTypes: shiftTypes(false) };
}

/* M11: danh sách chờ duyệt. Trưởng ca không duyệt công của chính mình. */
function pendingAttendance(ctx) {
  return dbAll('Attendance', function (a) {
    return (a.Status === 'pending' || a.Status === 'review') && (ctx.user.Role === 'admin' || a.EmployeeID !== ctx.user.EmployeeID);
  }).map(attendanceView).sort(function (a, b) { return String(a.BusinessDate).localeCompare(String(b.BusinessDate)); });
}

function assertCanReview(ctx, att) {
  if (ctx.user.Role !== 'admin' && att.EmployeeID === ctx.user.EmployeeID) fail('SELF', 'Không tự duyệt công của chính mình; chủ quán sẽ duyệt.');
  assertMonthOpen(att.BusinessDate);
}

function approveAttendance(ctx, p) {
  var att = dbGet('Attendance', p.attendanceId);
  if (!att) fail('NOT_FOUND', 'Không tìm thấy lượt chấm công');
  assertCanReview(ctx, att);
  if (!att.CheckOutTime) fail('INPUT', 'Lượt này chưa có giờ ra. Dùng Sửa giờ để nhập giờ ra.');
  resolveNotificationsFor('Attendance/' + att.AttendanceID, ctx, 'Đã duyệt');
  return dbUpdate(ctx, 'Attendance', att.AttendanceID, { Status: 'done', ApprovedBy: ctx.user.EmployeeID });
}

function editAttendance(ctx, p) {
  var att = dbGet('Attendance', p.attendanceId);
  if (!att) fail('NOT_FOUND', 'Không tìm thấy lượt chấm công');
  assertCanReview(ctx, att);
  if (!p.reason) fail('INPUT', 'Nhập lý do sửa giờ');
  var inMs = p.checkIn ? tsOnBusinessDate(att.BusinessDate, p.checkIn) : parseTs(att.CheckInTime);
  var outMs = p.checkOut ? tsOnBusinessDate(att.BusinessDate, p.checkOut) : parseTs(att.CheckOutTime);
  if (isNaN(inMs) || isNaN(outMs)) fail('INPUT', 'Nhập đủ giờ vào và giờ ra');
  if (outMs <= inMs) outMs += MS_DAY;
  resolveNotificationsFor('Attendance/' + att.AttendanceID, ctx, 'Đã sửa giờ');
  return dbUpdate(ctx, 'Attendance', att.AttendanceID, {
    CheckInTime: fmtTs(inMs), CheckOutTime: fmtTs(outMs), WorkHours: workHoursOf(inMs, outMs),
    LateMinutes: lateMinutesOf(att.BusinessDate, att.ShiftTypeID, inMs), Status: 'done',
    ApprovedBy: ctx.user.EmployeeID, Note: 'Sửa giờ: ' + p.reason
  });
}

function rejectAttendance(ctx, p) {
  var att = dbGet('Attendance', p.attendanceId);
  if (!att) fail('NOT_FOUND', 'Không tìm thấy lượt chấm công');
  assertCanReview(ctx, att);
  if (!p.reason) fail('INPUT', 'Nhập lý do từ chối');
  resolveNotificationsFor('Attendance/' + att.AttendanceID, ctx, 'Từ chối');
  notify('ATT', 'remind', 'Lượt chấm công ngày ' + fmtDateVN(att.BusinessDate) + ' bị từ chối: ' + p.reason, 'Attendance/' + att.AttendanceID, att.EmployeeID);
  return dbUpdate(ctx, 'Attendance', att.AttendanceID, { Status: 'rejected', ApprovedBy: ctx.user.EmployeeID, Note: 'Từ chối: ' + p.reason });
}

/* F-11: ứng lương lũy kế của 1 nhân viên trong tháng. */
function advanceTotal(employeeId, month) {
  return sum(dbAll('CashTransactions', function (t) {
    return t.TxnType === 'advance' && t.EmployeeID === employeeId && monthOf(t.BusinessDate) === month && !toBool(t.Deleted);
  }), function (t) { return t.Amount; });
}

/* W04 / M04: F-13 số ca theo loại, F-14 công quy đổi, F-15 giờ, F-16 lần muộn, F-11 ứng lương. */
function attendanceSummary(month, onlyEmployeeId) {
  var types = shiftTypes(false);
  var att = dbAll('Attendance', function (a) { return monthOf(a.BusinessDate) === month && (!onlyEmployeeId || a.EmployeeID === onlyEmployeeId); });
  var byEmp = groupBy(att, function (a) { return a.EmployeeID; });
  var emps = dbAll('Employees', function (e) { return (!onlyEmployeeId || e.EmployeeID === onlyEmployeeId) && (e.Status === 'active' || byEmp[e.EmployeeID]); });
  var lateLimit = settingNum('lateMinutes');
  return emps.map(function (e) {
    var list = byEmp[e.EmployeeID] || [];
    var done = list.filter(function (a) { return a.Status === 'done'; });
    var counts = {}, units = 0;
    types.forEach(function (t) {
      var n = done.filter(function (a) { return a.ShiftTypeID === t.ShiftTypeID; }).length;
      counts[t.ShiftTypeID] = n;
      units += n * toNum(t.WorkUnits || 1);
    });
    return {
      EmployeeID: e.EmployeeID, Name: e.DisplayName, FullName: e.FullName, counts: counts,
      totalShifts: done.length, workUnits: round2(units), hours: round2(sum(done, function (a) { return a.WorkHours; })),
      lateCount: done.filter(function (a) { return toNum(a.LateMinutes) > lateLimit; }).length,
      pendingCount: list.filter(function (a) { return a.Status === 'pending' || a.Status === 'review' || a.Status === 'open'; }).length,
      advance: advanceTotal(e.EmployeeID, month)
    };
  }).sort(function (a, b) { return String(a.EmployeeID).localeCompare(String(b.EmployeeID)); });
}

function attendanceMonth(ctx, p) {
  var month = p.month || monthOf(currentBusinessDate());
  return {
    month: month, shiftTypes: shiftTypes(false), rows: attendanceSummary(month),
    locked: dbGet('PayrollPeriods', month)
  };
}

function attendanceDetail(ctx, p) {
  return dbAll('Attendance', function (a) { return a.EmployeeID === p.employeeId && monthOf(a.BusinessDate) === p.month; })
    .map(attendanceView).sort(function (a, b) { return String(a.CheckInTime).localeCompare(String(b.CheckInTime)); });
}

function lockPayroll(ctx, p) {
  var month = p.month;
  if (dbGet('PayrollPeriods', month)) fail('DONE', 'Tháng này đã chốt');
  var pending = dbAll('Attendance', function (a) { return monthOf(a.BusinessDate) === month && (a.Status === 'pending' || a.Status === 'review' || a.Status === 'open'); });
  if (pending.length) fail('PENDING', 'Còn ' + pending.length + ' lượt chấm công chưa xử lý trong tháng. Duyệt hết trước khi chốt.');
  return dbInsert(ctx, 'PayrollPeriods', { Month: month, LockedBy: ctx.user.EmployeeID, LockedTime: nowTs() });
}

function whoIsWorking() {
  return dbAll('Attendance', function (a) { return a.Status === 'open'; }).map(attendanceView);
}

</script>
<script>
/* core\50_reports.js */
/* Báo cáo ca, giao dịch tiền mặt, bàn giao, duyệt và doanh thu ngày.
 * Màn hình: M06, M07, M08, M09, M10, W01, W02, W03, W07. Công thức F-01..F-12, F-17 (tab Đặc tả màn hình, mục 6). */

function isLeader(ctx) { return ctx.user.Role === 'leader' || ctx.user.Role === 'admin'; }
function isAdmin(ctx) { return ctx.user.Role === 'admin'; }

function ensureBusinessDay(bd) {
  if (!dbGet('BusinessDays', bd)) dbUpsertQuiet('BusinessDays', { BusinessDate: bd, Status: 'open', UpdatedTime: nowTs(), HasClosing: false });
}

function reportsOfDay(bd, includeDraft) {
  var order = {};
  checkpoints().forEach(function (c) { order[c.CheckpointID] = toNum(c.SortOrder); });
  return dbAll('ShiftReports', function (r) { return r.BusinessDate === bd && (includeDraft || r.Status !== 'draft'); })
    .sort(function (a, b) { return (order[a.CheckpointID] || 0) - (order[b.CheckpointID] || 0); });
}

function liveTxns(filterFn) {
  return dbAll('CashTransactions', function (t) { return !toBool(t.Deleted) && (!filterFn || filterFn(t)); });
}
function txnsOfReport(reportId) { return liveTxns(function (t) { return t.ReportID === reportId; }); }

/* Ngày gần nhất trước bd có báo cáo Cuối ngày (đã gửi). */
function prevClosingDay(bd) {
  var close = closingCheckpoint();
  if (!close) return null;
  var list = dbAll('ShiftReports', function (r) { return r.CheckpointID === close.CheckpointID && r.Status !== 'draft' && r.BusinessDate < bd; })
    .sort(function (a, b) { return String(b.BusinessDate).localeCompare(String(a.BusinessDate)); });
  return list[0] || null;
}

/* Tiền ra/vào két sau khi đóng cửa ngày bd: ghi ở W07 hoặc trong báo cáo Đầu ngày hôm sau (AfterClose = TRUE).
 * Trả về số ròng: nộp quỹ − (chi phí + ứng lương + rút quỹ + hoàn tiền). */
function afterCloseNet(bd, excludeReportId) {
  var after = liveTxns(function (t) { return t.BusinessDate === bd && toBool(t.AfterClose) && (!excludeReportId || t.ReportID !== excludeReportId); });
  return sum(after, function (t) { return t.TxnType === 'deposit' ? toNum(t.Amount) : -toNum(t.Amount); });
}

/* Ngày mà giao dịch trong báo cáo Đầu ngày thuộc về: ngày gần nhất trước bd có báo cáo Cuối ngày. */
function afterCloseDayFor(bd) {
  var prev = prevClosingDay(bd);
  return prev ? prev.BusinessDate : addDays(bd, -1);
}

/* F-01: két chuyển sang mốc Đầu ngày = két cuối ngày trước − tiền lấy ra sau đóng cửa + tiền nộp vào sau đóng cửa. */
function carryForOpening(bd, excludeReportId) {
  var prev = prevClosingDay(bd);
  if (!prev) return null;
  return toNum(prev.CashCounted) + afterCloseNet(prev.BusinessDate, excludeReportId);
}

/* F-02: két chuyển sang các mốc khác = số người nhận ca đếm ở mốc trước (chưa có người nhận → số người lập đếm). */
function carryForCheckpoint(bd, checkpointId, excludeReportId) {
  var cp = checkpointById(checkpointId);
  if (cp && toBool(cp.IsOpening)) return { amount: carryForOpening(bd, excludeReportId), source: 'F-01' };
  var before = reportsOfDay(bd, false).filter(function (r) {
    var c = checkpointById(r.CheckpointID);
    return c && toNum(c.SortOrder) < toNum(cp ? cp.SortOrder : 99);
  });
  var last = before[before.length - 1];
  if (last) return { amount: toNum(last.ReceiverID ? last.CashHandedOver : last.CashCounted), source: 'F-02', fromReport: last.ReportID };
  return { amount: carryForOpening(bd), source: 'F-01' };
}

function txnView(t) {
  var cat = t.CategoryID ? dbGet('ExpenseCategories', t.CategoryID) : null;
  return {
    TxnID: t.TxnID, ReportID: t.ReportID, BusinessDate: t.BusinessDate, TxnType: t.TxnType, TxnTypeName: TXN_TYPES[t.TxnType] || t.TxnType,
    CategoryID: t.CategoryID, CategoryName: cat ? cat.Name : '', Amount: toNum(t.Amount), Description: t.Description,
    EmployeeID: t.EmployeeID, EmployeeName: t.EmployeeID ? employeeName(t.EmployeeID) : '', CreatedBy: t.CreatedBy,
    CreatedByName: employeeName(t.CreatedBy), CreatedTime: t.CreatedTime, ReceiptImage: t.ReceiptImage,
    ApprovalStatus: t.ApprovalStatus, AfterClose: toBool(t.AfterClose), Note: t.Note
  };
}

function reportView(r, opts) {
  opts = opts || {};
  var cp = checkpointById(r.CheckpointID);
  var txns = txnsOfReport(r.ReportID).map(txnView);
  var v = {
    ReportID: r.ReportID, BusinessDate: r.BusinessDate, CheckpointID: r.CheckpointID, CheckpointName: cp ? cp.Name : r.CheckpointID,
    IsOpening: cp ? toBool(cp.IsOpening) : false, IsClosing: cp ? toBool(cp.IsClosing) : false,
    CashCarried: toNum(r.CashCarried), CashCounted: toNum(r.CashCounted), TransferAmount: toNum(r.TransferAmount), TransferImage: r.TransferImage,
    Difference: toNum(r.Difference), DifferenceReason: r.DifferenceReason, ReporterID: r.ReporterID, ReporterName: employeeName(r.ReporterID),
    CreatedTime: r.CreatedTime, SubmittedTime: r.SubmittedTime, ReceiverID: r.ReceiverID, ReceiverName: r.ReceiverID ? employeeName(r.ReceiverID) : '',
    CashHandedOver: toNum(r.CashHandedOver), HandoverDifference: toNum(r.HandoverDifference), HandoverReason: r.HandoverReason, ReceivedTime: r.ReceivedTime,
    ApproverID: r.ApproverID, ApproverName: r.ApproverID ? employeeName(r.ApproverID) : '', ApprovedTime: r.ApprovedTime, ReturnReason: r.ReturnReason,
    Status: r.Status, StatusName: REPORT_STATUS[r.Status] || r.Status, Source: r.Source, txns: txns,
    totals: txnTotals(txns), pendingTxns: txns.filter(function (t) { return t.ApprovalStatus === 'pending'; }).length
  };
  if (opts.hideCount) { v.CashCounted = null; v.totals = null; v.txns = []; }
  return v;
}

function txnTotals(txns) {
  var t = { expense: 0, advance: 0, withdraw: 0, deposit: 0, refund: 0 };
  txns.forEach(function (x) { if (t.hasOwnProperty(x.TxnType)) t[x.TxnType] += toNum(x.Amount); });
  return t;
}

function canEditReport(ctx, r) {
  if (r.ReporterID !== ctx.user.EmployeeID) return false;
  if (r.Status === 'draft' || r.Status === 'returned') return true;
  return r.Status === 'submitted' && !r.ReceiverID;
}

/* M06: dữ liệu để mở form báo cáo. */
function reportForm(ctx, p) {
  if (!ctx.user.IsCashier) fail('FORBIDDEN', 'Bạn chưa được giao quyền thu ngân.');
  var editing = p.reportId ? dbGet('ShiftReports', p.reportId) : null;
  if (editing && !canEditReport(ctx, editing)) editing = null;
  var bd = editing ? editing.BusinessDate : currentBusinessDate();
  var all = reportsOfDay(bd, true);
  var cps = checkpoints().map(function (c) {
    var r = all.filter(function (x) { return x.CheckpointID === c.CheckpointID && (x.Status !== 'draft' || x.ReporterID === ctx.user.EmployeeID); })[0];
    return {
      CheckpointID: c.CheckpointID, Name: c.Name, Deadline: c.Deadline, IsRequired: toBool(c.IsRequired), IsOpening: toBool(c.IsOpening), IsClosing: toBool(c.IsClosing),
      ReportID: r ? r.ReportID : '', ReportStatus: r ? r.Status : '', ReporterName: r ? employeeName(r.ReporterID) : '', Editable: r ? canEditReport(ctx, r) : true
    };
  });
  var cpId = editing ? editing.CheckpointID : p.checkpointId;
  if (!cpId) { var free = cps.filter(function (c) { return !c.ReportID || (c.Editable && c.ReportStatus === 'draft'); })[0]; cpId = free ? free.CheckpointID : cps[0].CheckpointID; }
  var slot = cps.filter(function (c) { return c.CheckpointID === cpId; })[0];
  var existing = editing || (slot && slot.ReportID ? dbGet('ShiftReports', slot.ReportID) : null);
  var carry = carryForCheckpoint(bd, cpId, existing ? existing.ReportID : null);
  // Số liệu các báo cáo khác trong ngày → giao diện tính doanh thu tạm tính (F-03) khi lập báo cáo Cuối ngày.
  var others = reportsOfDay(bd, false).filter(function (r) { return !existing || r.ReportID !== existing.ReportID; });
  var otherIds = {};
  others.forEach(function (r) { otherIds[r.ReportID] = true; });
  var openRep = others.filter(function (r) { var c = checkpointById(r.CheckpointID); return c && toBool(c.IsOpening); })[0];
  var carriedOpen = carryForOpening(bd);
  var dayOthers = {
    transfer: sum(others, function (r) { return r.TransferAmount; }),
    totals: txnTotals(liveTxns(function (t) { return otherIds[t.ReportID] && !toBool(t.AfterClose); })),
    openingCounted: openRep ? toNum(openRep.CashCounted) : (carriedOpen === null ? null : carriedOpen)
  };
  return {
    businessDate: bd, checkpoints: cps, checkpointId: cpId, dayOthers: dayOthers,
    report: existing ? reportView(existing) : null,
    readOnly: existing ? !canEditReport(ctx, existing) : false,
    cashCarried: carry.amount, carrySource: carry.source,
    categories: dbAll('ExpenseCategories', function (c) { return toBool(c.IsActive); }),
    employees: dbAll('Employees', function (e) { return e.Status === 'active'; }).map(function (e) {
      return { EmployeeID: e.EmployeeID, Name: e.DisplayName, advanceMonth: advanceTotal(e.EmployeeID, monthOf(bd)) };
    }),
    canFund: isLeader(ctx),
    limits: {
      missingZero: settingNum('missingZeroThreshold'), maxCash: settingNum('maxCash'), maxTransfer: settingNum('maxTransfer'),
      expenseApproval: settingNum('expenseApprovalThreshold'), advanceLimit: settingNum('advanceMonthlyLimit'), diff: settingNum('diffThreshold')
    }
  };
}

function amountWarnings(label, v, maxKey) {
  var w = [];
  var t = settingNum('missingZeroThreshold');
  if (v > 0 && v < t) w.push({ code: 'CB-06', text: label + ' ' + fmtMoney(v) + ' đ có thể thiếu số 0 (ý là ' + fmtMoney(v * 1000) + ' đ?)' });
  if (maxKey && v > settingNum(maxKey)) w.push({ code: 'CB-07', text: label + ' ' + fmtMoney(v) + ' đ vượt mức thường gặp ' + fmtMoney(settingNum(maxKey)) + ' đ' });
  return w;
}

/* M06 + M07: lưu nháp hoặc gửi báo cáo cùng toàn bộ giao dịch tiền mặt. */
function saveReport(ctx, p) {
  if (!ctx.user.IsCashier) fail('FORBIDDEN', 'Bạn chưa được giao quyền thu ngân.');
  var existing = p.reportId ? dbGet('ShiftReports', p.reportId) : null;
  if (existing && !canEditReport(ctx, existing)) fail('LOCKED', 'Báo cáo này không còn sửa được.');
  var bd = existing ? existing.BusinessDate : currentBusinessDate();
  var cpId = existing ? existing.CheckpointID : p.checkpointId;
  var cp = checkpointById(cpId);
  if (!cp) fail('INPUT', 'Chọn mốc kiểm két');
  var clash = dbAll('ShiftReports', function (r) {
    return r.BusinessDate === bd && r.CheckpointID === cpId && (!existing || r.ReportID !== existing.ReportID) &&
      (r.Status !== 'draft' || r.ReporterID === ctx.user.EmployeeID);
  });
  if (clash.length) fail('CB-10', 'Mốc ' + cp.Name + ' ngày ' + fmtDateVN(bd) + ' đã có báo cáo của ' + employeeName(clash[0].ReporterID) + '. Mở báo cáo đó để xem.', { reportId: clash[0].ReportID });

  var submit = !!p.submit;
  var isOpening = toBool(cp.IsOpening);
  var cash = toNum(p.cashCounted);
  var transfer = isOpening ? 0 : toNum(p.transferAmount);
  var txns = (p.txns || []).filter(function (t) { return t && !t._removed; });

  // Kiểm tra từng giao dịch (FR-EX-01, FR-EX-02).
  var errors = [];
  txns.forEach(function (t, i) {
    var n = 'Khoản ' + (i + 1) + ': ';
    if (!TXN_TYPES[t.TxnType]) errors.push(n + 'chọn loại giao dịch');
    if (!(toNum(t.Amount) > 0)) errors.push(n + 'số tiền phải lớn hơn 0');
    if (!String(t.Description || '').trim()) errors.push(n + 'nhập nội dung');
    if (t.TxnType === 'expense' && !t.CategoryID) errors.push(n + 'chọn nhóm chi');
    if (t.TxnType === 'advance' && !t.EmployeeID) errors.push(n + 'chọn nhân viên ứng lương');
    if ((t.TxnType === 'withdraw' || t.TxnType === 'deposit') && !isLeader(ctx)) errors.push(n + 'chỉ trưởng ca hoặc chủ quán ghi rút/nộp quỹ');
  });
  if (submit) {
    if (p.cashCounted === '' || p.cashCounted === null || p.cashCounted === undefined) errors.push('Nhập tiền mặt đếm được');
    if (!isOpening && (p.transferAmount === '' || p.transferAmount === null || p.transferAmount === undefined)) errors.push('Nhập tiền chuyển khoản (không có thì nhập 0)');
  }
  if (errors.length) fail('INPUT', errors.join('\n'));

  var carry = carryForCheckpoint(bd, cpId, existing ? existing.ReportID : null);
  // Báo cáo Đầu ngày: các khoản ghi kèm là tiền ra/vào két từ lúc đóng cửa hôm trước → két dự kiến = F-01 + số ròng các khoản đó.
  var netBefore = isOpening ? sum(txns, function (t) { return t.TxnType === 'deposit' ? toNum(t.Amount) : -toNum(t.Amount); }) : 0;
  var expected = carry.amount === null ? null : carry.amount + netBefore;
  var diff = isOpening && expected !== null ? cash - expected : 0;
  if (submit && isOpening && diff !== 0 && !String(p.differenceReason || '').trim()) {
    fail('CB-09', 'Két đầu ngày lệch ' + fmtMoney(diff) + ' đ so với két dự kiến ' + fmtMoney(expected) + ' đ. Nhập lý do chênh lệch.', { diff: diff, carried: expected });
  }

  // Cảnh báo cần xác nhận trước khi gửi (CB-06, CB-07).
  if (submit && !p.confirmWarnings) {
    var warns = amountWarnings('Tiền mặt', cash, 'maxCash');
    if (!isOpening) warns = warns.concat(amountWarnings('Tiền CK', transfer, 'maxTransfer'));
    txns.forEach(function (t, i) { warns = warns.concat(amountWarnings('Khoản ' + (i + 1), toNum(t.Amount))); });
    if (warns.length) return { needConfirm: true, warnings: warns };
  }

  var now = nowTs();
  var fields = {
    CashCarried: carry.amount === null ? '' : carry.amount, CashCounted: cash, TransferAmount: transfer,
    TransferImage: p.transferImage || (existing ? existing.TransferImage : ''), Difference: diff,
    DifferenceReason: String(p.differenceReason || '').trim(), Status: submit ? 'submitted' : 'draft'
  };
  if (submit) fields.SubmittedTime = now;
  var report;
  if (existing) {
    if (existing.Status === 'returned') fields.ReturnReason = existing.ReturnReason;
    report = dbUpdate(ctx, 'ShiftReports', existing.ReportID, fields);
  } else {
    fields.ReportID = uid('R'); fields.BusinessDate = bd; fields.CheckpointID = cpId; fields.ReporterID = ctx.user.EmployeeID;
    fields.CreatedTime = now; fields.Source = 'app';
    report = dbInsert(ctx, 'ShiftReports', fields);
  }

  // Ghi giao dịch: thêm mới, sửa, đánh dấu xóa (không xóa cứng — NFR-06).
  var keep = {}, notes = [];
  var expThreshold = settingNum('expenseApprovalThreshold');
  txns.forEach(function (t) {
    var amount = toNum(t.Amount);
    var row = {
      ReportID: report.ReportID, BusinessDate: isOpening ? afterCloseDayFor(bd) : bd, TxnType: t.TxnType, CategoryID: t.TxnType === 'expense' ? t.CategoryID : '',
      Amount: amount, Description: String(t.Description).trim(), EmployeeID: t.TxnType === 'advance' ? t.EmployeeID : '',
      ReceiptImage: t.ReceiptImage || '', AfterClose: isOpening, Deleted: false
    };
    var old = t.TxnID ? dbGet('CashTransactions', t.TxnID) : null;
    if (old && old.ReportID === report.ReportID) {
      if (toNum(old.Amount) !== amount && old.ApprovalStatus === 'approved') row.ApprovalStatus = 'none';
      dbUpdate(ctx, 'CashTransactions', old.TxnID, row);
      keep[old.TxnID] = true;
      row.TxnID = old.TxnID;
    } else {
      row.TxnID = uid('T'); row.CreatedBy = ctx.user.EmployeeID; row.CreatedTime = now; row.ApprovalStatus = 'none';
      dbInsert(ctx, 'CashTransactions', row);
      keep[row.TxnID] = true;
    }
    if (submit && t.TxnType === 'expense' && amount >= expThreshold) {
      var cur = dbGet('CashTransactions', row.TxnID);
      if (cur.ApprovalStatus !== 'approved') {
        dbUpdate(ctx, 'CashTransactions', row.TxnID, { ApprovalStatus: 'pending' });
        notify('CB-13', 'warn', 'Khoản chi ' + fmtMoney(amount) + ' đ "' + row.Description + '" cần duyệt.', 'CashTransactions/' + row.TxnID, 'leader', 'CB-13/' + row.TxnID);
        notes.push('CB-13: khoản chi ' + fmtMoney(amount) + ' đ chờ trưởng ca/chủ quán duyệt');
      }
    }
  });
  txnsOfReport(report.ReportID).forEach(function (t) {
    if (!keep[t.TxnID]) dbUpdate(ctx, 'CashTransactions', t.TxnID, { Deleted: true });
  });

  if (submit) {
    // CB-14: ứng lương vượt hạn mức tháng.
    var month = monthOf(bd), limit = settingNum('advanceMonthlyLimit');
    var advanced = {};
    txns.forEach(function (t) { if (t.TxnType === 'advance') advanced[t.EmployeeID] = true; });
    Object.keys(advanced).forEach(function (emp) {
      var total = advanceTotal(emp, month);
      if (total > limit) {
        notify('CB-14', 'warn', employeeName(emp) + ' đã ứng ' + fmtMoney(total) + ' đ trong tháng ' + month + ', vượt hạn mức ' + fmtMoney(limit) + ' đ.', 'Employees/' + emp, 'admin', 'CB-14/' + emp + '/' + month + '/' + total);
        notes.push('CB-14: ' + employeeName(emp) + ' ứng vượt hạn mức tháng');
      }
    });
    if (isOpening && diff !== 0 && Math.abs(diff) > settingNum('diffThreshold')) {
      notify('CB-09', 'warn', 'Két đầu ngày ' + fmtDateVN(bd) + ' lệch ' + fmtMoney(diff) + ' đ. Lý do: ' + fields.DifferenceReason, 'ShiftReports/' + report.ReportID, 'admin');
    }
    resolveNotificationsFor('ShiftReports/' + report.ReportID, ctx, 'Đã gửi lại');
    notify('SR', 'remind', ctx.user.DisplayName + ' gửi báo cáo ' + cp.Name + ' ngày ' + fmtDateVN(bd) + ', chờ duyệt.', 'ShiftReports/' + report.ReportID, 'leader', 'SR/' + report.ReportID);
    var day = recomputeDay(bd);
    if (toBool(cp.IsClosing)) notes = notes.concat(closingChecks(bd, day));
  }
  return { report: reportView(dbGet('ShiftReports', report.ReportID)), notes: notes };
}

/* Tính lại BusinessDays cho 1 ngày: F-03 doanh thu, F-05 lợi nhuận, F-06, F-12. */
function recomputeDay(bd) {
  var rs = reportsOfDay(bd, false);
  var ids = {};
  rs.forEach(function (r) { ids[r.ReportID] = true; });
  var open = rs.filter(function (r) { var c = checkpointById(r.CheckpointID); return c && toBool(c.IsOpening); })[0];
  var close = rs.filter(function (r) { var c = checkpointById(r.CheckpointID); return c && toBool(c.IsClosing); })[0];
  var carried = carryForOpening(bd);
  var openingCounted = open ? toNum(open.CashCounted) : (carried === null ? 0 : carried);
  var openingDiff = open && carried !== null ? toNum(open.CashCounted) - carried : 0;
  var tx = txnTotals(liveTxns(function (t) { return ids[t.ReportID] && !toBool(t.AfterClose); }));
  var transfer = sum(rs, function (r) { return r.TransferAmount; });
  var last = close || rs[rs.length - 1];
  var closing = last ? toNum(last.CashCounted) : openingCounted;
  var revenue = rs.length ? transfer + closing + tx.expense + tx.advance + tx.withdraw - tx.deposit - openingCounted : 0;
  var handoverDiff = sum(rs, function (r) { return r.ReceiverID ? r.HandoverDifference : 0; });
  var status = 'open';
  if (close) {
    status = rs.every(function (r) { return r.Status === 'approved' || r.Status === 'adjusted'; }) ? 'closed' : 'submitted';
    if (rs.some(function (r) { return r.Status === 'adjusted'; })) status = 'adjusted';
  }
  var row = {
    BusinessDate: bd, OpeningCarried: carried === null ? '' : carried, OpeningCounted: openingCounted, OpeningDifference: openingDiff,
    ClosingCash: closing, TotalTransfer: transfer, TotalExpense: tx.expense, TotalAdvance: tx.advance, TotalWithdraw: tx.withdraw,
    TotalDeposit: tx.deposit, TotalRefund: tx.refund, Revenue: revenue,
    // Chi phí phát sinh sau đóng cửa vẫn là chi phí của ngày đó, dù không nằm trong công thức doanh thu.
    Profit: revenue - tx.expense - sum(liveTxns(function (t) { return t.BusinessDate === bd && toBool(t.AfterClose) && t.TxnType === 'expense'; }), function (t) { return t.Amount; }),
    TotalDifference: openingDiff + handoverDiff, HasClosing: !!close, Status: status, UpdatedTime: nowTs()
  };
  dbUpsertQuiet('BusinessDays', row);
  return row;
}

/* Sau khi sửa số của 1 ngày, ngày kế tiếp có két chuyển sang (F-01) thay đổi theo. */
function recomputeFrom(bd) {
  recomputeDay(bd);
  var next = dbAll('BusinessDays', function (d) { return d.BusinessDate > bd; })
    .sort(function (a, b) { return String(a.BusinessDate).localeCompare(String(b.BusinessDate)); })[0];
  if (next) recomputeDay(next.BusinessDate);
}

/* F-17: doanh thu trung bình 30 ngày đã chốt gần nhất. */
function avgRevenue30(bd) {
  var from = addDays(bd, -30);
  var days = dbAll('BusinessDays', function (d) { return d.BusinessDate >= from && d.BusinessDate < bd && toBool(d.HasClosing) && toNum(d.Revenue) !== 0; });
  return days.length ? sum(days, function (d) { return d.Revenue; }) / days.length : null;
}

/* Kiểm tra khi có báo cáo Cuối ngày: CB-15 doanh thu bất thường, CB-17 tồn két cao. */
function closingChecks(bd, day) {
  var notes = [];
  var rev = toNum(day.Revenue), avg = avgRevenue30(bd), pct = settingNum('revenueAnomalyPct');
  if (rev < 0 || (avg && Math.abs(rev - avg) / avg * 100 > pct)) {
    var msg = 'Doanh thu ngày ' + fmtDateVN(bd) + ' là ' + fmtMoney(rev) + ' đ' + (avg ? ', trung bình 30 ngày ' + fmtMoney(avg) + ' đ' : '') + '. Kiểm tra lại số liệu.';
    notify('CB-15', 'warn', msg, 'BusinessDays/' + bd, 'admin', 'CB-15/' + bd);
    notes.push('CB-15: ' + msg);
  }
  var cash = cashOnHand();
  if (cash.amount > settingNum('safeCashLevel')) {
    notify('CB-17', 'remind', 'Tồn két ' + fmtMoney(cash.amount) + ' đ, vượt mức an toàn ' + fmtMoney(settingNum('safeCashLevel')) + ' đ. Nên rút quỹ.', 'BusinessDays/' + bd, 'admin', 'CB-17/' + bd);
  }
  return notes;
}

/* F-09: tồn két hiện tại. */
function cashOnHand() {
  var latest = dbAll('ShiftReports', function (r) { return r.Status !== 'draft'; })
    .sort(function (a, b) {
      var c = String(b.BusinessDate).localeCompare(String(a.BusinessDate));
      if (c) return c;
      var ca = checkpointById(a.CheckpointID), cb = checkpointById(b.CheckpointID);
      return toNum(cb ? cb.SortOrder : 0) - toNum(ca ? ca.SortOrder : 0);
    })[0];
  if (!latest) return { amount: 0, asOf: '', label: 'Chưa có báo cáo' };
  var amount = toNum(latest.ReceiverID ? latest.CashHandedOver : latest.CashCounted);
  var cp = checkpointById(latest.CheckpointID);
  if (cp && toBool(cp.IsClosing)) amount += afterCloseNet(latest.BusinessDate);
  return { amount: amount, asOf: latest.SubmittedTime, label: (cp ? cp.Name : '') + ' ' + fmtDateVN(latest.BusinessDate) };
}

/* ---- M08: bàn giao ---- */
function pendingHandovers(ctx) {
  if (!ctx.user.IsCashier) return [];
  var since = addDays(currentBusinessDate(), -1);
  return dbAll('ShiftReports', function (r) {
    if (r.Source === 'import' || r.BusinessDate < since) return false;
    if (r.Status === 'draft' || r.Status === 'returned' || r.ReceiverID || r.ReporterID === ctx.user.EmployeeID) return false;
    var cp = checkpointById(r.CheckpointID);
    if (!cp || toBool(cp.IsClosing)) return false;
    // Hết hiệu lực khi đã có báo cáo mốc sau trong cùng ngày.
    var later = reportsOfDay(r.BusinessDate, false).filter(function (x) { var c = checkpointById(x.CheckpointID); return c && toNum(c.SortOrder) > toNum(cp.SortOrder); });
    return later.length === 0;
  }).map(function (r) { return reportView(r, { hideCount: true }); });
}

function receiveHandover(ctx, p) {
  var r = dbGet('ShiftReports', p.reportId);
  if (!r) fail('NOT_FOUND', 'Không tìm thấy báo cáo');
  if (r.ReporterID === ctx.user.EmployeeID) fail('SELF', 'Không tự nhận ca của chính mình');
  if (r.ReceiverID) fail('DONE', 'Ca này đã có người nhận: ' + employeeName(r.ReceiverID));
  if (p.cashCounted === '' || p.cashCounted === undefined || p.cashCounted === null) fail('INPUT', 'Nhập số tiền bạn đếm được');
  var counted = toNum(p.cashCounted);
  var diff = counted - toNum(r.CashCounted); // F-07
  if (diff !== 0 && !String(p.reason || '').trim()) {
    return { needReason: true, diff: diff, reporterCount: toNum(r.CashCounted), reporterName: employeeName(r.ReporterID) };
  }
  if (!p.confirmWarnings) {
    var w = amountWarnings('Tiền đếm', counted, 'maxCash');
    if (w.length) return { needConfirm: true, warnings: w };
  }
  var row = dbUpdate(ctx, 'ShiftReports', r.ReportID, {
    ReceiverID: ctx.user.EmployeeID, CashHandedOver: counted, HandoverDifference: diff,
    HandoverReason: String(p.reason || '').trim(), ReceivedTime: nowTs()
  });
  if (diff !== 0) {
    var lvl = Math.abs(diff) > settingNum('diffThreshold') ? 'warn' : 'remind';
    notify('CB-08', lvl, 'Bàn giao ' + (checkpointById(r.CheckpointID) || {}).Name + ' ngày ' + fmtDateVN(r.BusinessDate) + ': ' +
      employeeName(r.ReporterID) + ' khai ' + fmtMoney(r.CashCounted) + ' đ, ' + ctx.user.DisplayName + ' đếm ' + fmtMoney(counted) +
      ' đ (lệch ' + fmtMoney(diff) + ' đ). Lý do: ' + p.reason, 'ShiftReports/' + r.ReportID, lvl === 'warn' ? 'admin,' + r.ReporterID : 'leader,' + r.ReporterID);
  }
  recomputeDay(r.BusinessDate);
  return { report: reportView(row), diff: diff };
}

/* ---- M09 / M10 ---- */
function myReports(ctx, p) {
  var month = p.month || monthOf(currentBusinessDate());
  return dbAll('ShiftReports', function (r) {
    return (r.ReporterID === ctx.user.EmployeeID || r.ReceiverID === ctx.user.EmployeeID) && monthOf(r.BusinessDate) === month && (!p.status || r.Status === p.status);
  }).sort(function (a, b) { return String(b.CreatedTime).localeCompare(String(a.CreatedTime)); }).map(function (r) { return reportView(r); });
}

function getReport(ctx, p) {
  var r = dbGet('ShiftReports', p.reportId);
  if (!r) fail('NOT_FOUND', 'Không tìm thấy báo cáo');
  if (!isLeader(ctx) && r.ReporterID !== ctx.user.EmployeeID && r.ReceiverID !== ctx.user.EmployeeID) fail('FORBIDDEN', 'Bạn không xem được báo cáo này');
  var v = reportView(r);
  v.canEdit = canEditReport(ctx, r);
  v.canReview = isLeader(ctx) && (isAdmin(ctx) || r.ReporterID !== ctx.user.EmployeeID) && r.Status === 'submitted';
  return v;
}

function pendingReports(ctx) {
  return dbAll('ShiftReports', function (r) {
    return r.Status === 'submitted' && (isAdmin(ctx) || r.ReporterID !== ctx.user.EmployeeID);
  }).map(function (r) { return reportView(r); }).sort(function (a, b) {
    var pa = (a.pendingTxns || Math.abs(a.Difference) || Math.abs(a.HandoverDifference)) ? 0 : 1;
    var pb = (b.pendingTxns || Math.abs(b.Difference) || Math.abs(b.HandoverDifference)) ? 0 : 1;
    return pa - pb || String(b.BusinessDate).localeCompare(String(a.BusinessDate));
  });
}

function assertReviewer(ctx, r) {
  if (!isLeader(ctx)) fail('FORBIDDEN', 'Chỉ trưởng ca hoặc chủ quán được duyệt');
  if (!isAdmin(ctx) && r.ReporterID === ctx.user.EmployeeID) fail('SELF', 'Không tự duyệt báo cáo của chính mình; chủ quán sẽ duyệt.');
}

function approveTxn(ctx, p) {
  var t = dbGet('CashTransactions', p.txnId);
  if (!t) fail('NOT_FOUND', 'Không tìm thấy giao dịch');
  var r = dbGet('ShiftReports', t.ReportID);
  if (r) assertReviewer(ctx, r); else if (!isLeader(ctx)) fail('FORBIDDEN', 'Không có quyền');
  resolveNotificationsFor('CashTransactions/' + t.TxnID, ctx, 'Đã duyệt');
  return dbUpdate(ctx, 'CashTransactions', t.TxnID, { ApprovalStatus: 'approved', ApprovedBy: ctx.user.EmployeeID });
}

function approveReport(ctx, p) {
  var r = dbGet('ShiftReports', p.reportId);
  if (!r) fail('NOT_FOUND', 'Không tìm thấy báo cáo');
  assertReviewer(ctx, r);
  if (r.Status !== 'submitted') fail('STATE', 'Báo cáo đang ở trạng thái ' + (REPORT_STATUS[r.Status] || r.Status));
  var pend = txnsOfReport(r.ReportID).filter(function (t) { return t.ApprovalStatus === 'pending'; });
  if (pend.length) fail('CB-13', 'Còn ' + pend.length + ' khoản chi chờ duyệt. Duyệt từng khoản trước, hoặc trả lại báo cáo.');
  dbUpdate(ctx, 'ShiftReports', r.ReportID, { Status: 'approved', ApproverID: ctx.user.EmployeeID, ApprovedTime: nowTs() });
  resolveNotificationsFor('ShiftReports/' + r.ReportID, ctx, 'Đã duyệt');
  recomputeDay(r.BusinessDate);
  return reportView(dbGet('ShiftReports', r.ReportID));
}

function returnReport(ctx, p) {
  var r = dbGet('ShiftReports', p.reportId);
  if (!r) fail('NOT_FOUND', 'Không tìm thấy báo cáo');
  assertReviewer(ctx, r);
  if (r.Status !== 'submitted') fail('STATE', 'Chỉ trả lại được báo cáo đang chờ duyệt');
  if (!String(p.reason || '').trim()) fail('INPUT', 'Nhập lý do trả lại');
  dbUpdate(ctx, 'ShiftReports', r.ReportID, { Status: 'returned', ReturnReason: p.reason, ApproverID: ctx.user.EmployeeID, ApprovedTime: nowTs(), ReceiverID: '', CashHandedOver: '', HandoverDifference: '', HandoverReason: '', ReceivedTime: '' });
  resolveNotificationsFor('ShiftReports/' + r.ReportID, ctx, 'Trả lại');
  notify('RET', 'remind', 'Báo cáo ' + (checkpointById(r.CheckpointID) || {}).Name + ' ngày ' + fmtDateVN(r.BusinessDate) + ' bị trả lại: ' + p.reason, 'ShiftReports/' + r.ReportID, r.ReporterID, 'RET/' + r.ReportID);
  recomputeDay(r.BusinessDate);
  return reportView(dbGet('ShiftReports', r.ReportID));
}

/* ---- Web quản trị ---- */
function periodRange(p) {
  var today = currentBusinessDate(), from = today, to = today, kind = p.period || 'today';
  if (kind === 'week') { var dow = (new Date(parseTs(today) + APP.tzOffsetHours * MS_HOUR).getUTCDay() + 6) % 7; from = addDays(today, -dow); }
  else if (kind === 'month') from = today.slice(0, 7) + '-01';
  else if (kind === 'year') from = today.slice(0, 4) + '-01-01';
  else if (kind === 'custom') { from = p.from || today; to = p.to || today; }
  var len = Math.round((parseTs(to) - parseTs(from)) / MS_DAY) + 1;
  return { from: from, to: to, prevFrom: addDays(from, -len), prevTo: addDays(from, -1), kind: kind };
}

function daysIn(from, to) {
  return dbAll('BusinessDays', function (d) { return d.BusinessDate >= from && d.BusinessDate <= to; });
}

function periodTotals(from, to) {
  var days = daysIn(from, to);
  var rev = sum(days, function (d) { return d.Revenue; }), tr = sum(days, function (d) { return d.TotalTransfer; });
  var exp = sum(days, function (d) { return d.TotalExpense; });
  return { revenue: rev, transfer: tr, cash: rev - tr, expense: exp, profit: rev - exp, days: days.length };
}

function expenseMix(from, to) {
  var tx = liveTxns(function (t) { return t.TxnType === 'expense' && t.BusinessDate >= from && t.BusinessDate <= to; });
  var total = sum(tx, function (t) { return t.Amount; });
  var g = groupBy(tx, function (t) { return t.CategoryID || 'KHAC'; });
  return Object.keys(g).map(function (k) {
    var c = dbGet('ExpenseCategories', k), amt = sum(g[k], function (t) { return t.Amount; });
    return { CategoryID: k, Name: c ? c.Name : k, amount: amt, share: total ? round2(amt / total * 100) : 0, count: g[k].length }; // F-10
  }).sort(function (a, b) { return b.amount - a.amount; });
}

function dashboard(ctx, p) {
  var today = currentBusinessDate();
  recomputeDay(today);
  var r = periodRange(p || {});
  var cur = periodTotals(r.from, r.to), prev = periodTotals(r.prevFrom, r.prevTo);
  var series = [];
  for (var i = 29; i >= 0; i--) {
    var d = addDays(today, -i), row = dbGet('BusinessDays', d);
    series.push({ date: d, revenue: row ? toNum(row.Revenue) : 0, hasClosing: row ? toBool(row.HasClosing) : false, hasData: !!row && toNum(row.Revenue) !== 0 });
  }
  var todayRs = reportsOfDay(today, false);
  return {
    today: today, range: r,
    revenueToday: periodTotals(today, today).revenue,
    revenueMonth: periodTotals(today.slice(0, 7) + '-01', today).revenue,
    revenueYear: periodTotals(today.slice(0, 4) + '-01-01', today).revenue,
    current: cur, previous: prev, cashOnHand: cashOnHand(), series: series, expenseMix: expenseMix(r.from, r.to),
    checkpoints: checkpoints().map(function (c) {
      var rep = todayRs.filter(function (x) { return x.CheckpointID === c.CheckpointID; })[0];
      return { Name: c.Name, Deadline: c.Deadline, IsRequired: toBool(c.IsRequired), status: rep ? rep.Status : '', reporter: rep ? employeeName(rep.ReporterID) : '' };
    }),
    working: whoIsWorking(),
    alerts: listAlerts(ctx, { status: 'open', limit: 5 })
  };
}

function businessDays(ctx, p) {
  var month = p.month || monthOf(currentBusinessDate());
  var today = currentBusinessDate();
  return dbAll('BusinessDays', function (d) { return monthOf(d.BusinessDate) === month; })
    .sort(function (a, b) { return String(b.BusinessDate).localeCompare(String(a.BusinessDate)); })
    .map(function (d) {
      var o = {};
      SCHEMA.BusinessDays.cols.forEach(function (c) { o[c] = d[c]; });
      o.HasClosing = toBool(d.HasClosing);
      o.missingClosing = !o.HasClosing && d.BusinessDate < today; // CB-12
      return o;
    });
}

function dayDetail(ctx, p) {
  var bd = p.businessDate;
  var day = recomputeDay(bd);
  return {
    day: day, reports: reportsOfDay(bd, false).map(function (r) { return reportView(r); }),
    afterClose: liveTxns(function (t) { return t.BusinessDate === bd && toBool(t.AfterClose); }).map(txnView),
    attendance: dbAll('Attendance', function (a) { return a.BusinessDate === bd; }).map(attendanceView),
    carried: carryForOpening(bd)
  };
}

/* W02 Điều chỉnh: chỉ chủ quán; bắt buộc lý do; ghi nhật ký; tính lại ngày và ngày sau. */
function adjustReport(ctx, p) {
  var r = dbGet('ShiftReports', p.reportId);
  if (!r) fail('NOT_FOUND', 'Không tìm thấy báo cáo');
  if (!String(p.reason || '').trim()) fail('INPUT', 'Nhập lý do điều chỉnh');
  var patch = { Status: 'adjusted' };
  ['CashCounted', 'TransferAmount', 'CashHandedOver'].forEach(function (k) {
    if (p.fields && p.fields[k] !== undefined && p.fields[k] !== '') patch[k] = toNum(p.fields[k]);
  });
  if (patch.CashHandedOver !== undefined && r.ReceiverID) patch.HandoverDifference = patch.CashHandedOver - toNum(patch.CashCounted !== undefined ? patch.CashCounted : r.CashCounted);
  dbUpdate(ctx, 'ShiftReports', r.ReportID, patch);
  audit(ctx, 'ShiftReports', r.ReportID, 'Điều chỉnh', '', p.reason);
  recomputeFrom(r.BusinessDate);
  return reportView(dbGet('ShiftReports', r.ReportID));
}

function adjustTxn(ctx, p) {
  var t = dbGet('CashTransactions', p.txnId);
  if (!t) fail('NOT_FOUND', 'Không tìm thấy giao dịch');
  if (!String(p.reason || '').trim()) fail('INPUT', 'Nhập lý do');
  var f = p.fields || {}, patch = {};
  if (f.TxnType && TXN_TYPES[f.TxnType]) patch.TxnType = f.TxnType;
  if (f.CategoryID !== undefined) patch.CategoryID = f.CategoryID;
  if (f.EmployeeID !== undefined) patch.EmployeeID = f.EmployeeID;
  if (f.Amount !== undefined && f.Amount !== '') patch.Amount = toNum(f.Amount);
  if (f.Deleted !== undefined) patch.Deleted = !!f.Deleted;
  var type = patch.TxnType || t.TxnType;
  if (type === 'expense' && !(patch.CategoryID || t.CategoryID)) fail('INPUT', 'Chọn nhóm chi');
  if (type === 'advance' && !(patch.EmployeeID || t.EmployeeID)) fail('INPUT', 'Chọn nhân viên');
  patch.Note = (t.Note ? t.Note + ' | ' : '') + 'Điều chỉnh: ' + p.reason;
  dbUpdate(ctx, 'CashTransactions', t.TxnID, patch);
  var r = dbGet('ShiftReports', t.ReportID);
  if (r && r.Status === 'approved') dbUpdate(ctx, 'ShiftReports', r.ReportID, { Status: 'adjusted' });
  recomputeFrom(t.BusinessDate);
  return txnView(dbGet('CashTransactions', t.TxnID));
}

/* W03 */
function expenseReport(ctx, p) {
  var r = periodRange(p);
  var tx = liveTxns(function (t) {
    return t.TxnType === 'expense' && t.BusinessDate >= r.from && t.BusinessDate <= r.to &&
      (!p.categoryId || t.CategoryID === p.categoryId) && (!p.employeeId || t.CreatedBy === p.employeeId);
  }).map(txnView).sort(function (a, b) { return String(b.CreatedTime).localeCompare(String(a.CreatedTime)); });
  var mix = expenseMix(r.from, r.to), prevMix = expenseMix(r.prevFrom, r.prevTo);
  mix.forEach(function (m) { var pm = prevMix.filter(function (x) { return x.CategoryID === m.CategoryID; })[0]; m.previous = pm ? pm.amount : 0; });
  return { range: r, mix: mix, total: sum(mix, function (m) { return m.amount; }), previousTotal: sum(prevMix, function (m) { return m.amount; }), rows: tx, categories: dbAll('ExpenseCategories') };
}

/* W07 */
function recordFund(ctx, p) {
  if (!isLeader(ctx)) fail('FORBIDDEN', 'Không có quyền');
  if (p.txnType !== 'withdraw' && p.txnType !== 'deposit') fail('INPUT', 'Chọn Rút quỹ hoặc Nộp quỹ');
  if (!(toNum(p.amount) > 0)) fail('INPUT', 'Nhập số tiền');
  if (!p.businessDate) fail('INPUT', 'Chọn ngày');
  if (!String(p.description || '').trim()) fail('INPUT', 'Nhập người rút/nộp và ghi chú');
  var row = dbInsert(ctx, 'CashTransactions', {
    TxnID: uid('T'), ReportID: '', BusinessDate: p.businessDate, TxnType: p.txnType, Amount: toNum(p.amount),
    Description: String(p.description).trim(), CreatedBy: ctx.user.EmployeeID, CreatedTime: nowTs(), ApprovalStatus: 'none', AfterClose: true, Deleted: false
  });
  recomputeFrom(p.businessDate);
  return txnView(row);
}

function funds(ctx, p) {
  var r = periodRange(p.period ? p : { period: 'month' });
  var tx = liveTxns(function (t) { return (t.TxnType === 'withdraw' || t.TxnType === 'deposit') && t.BusinessDate >= r.from && t.BusinessDate <= r.to; })
    .map(txnView).sort(function (a, b) { return String(b.CreatedTime).localeCompare(String(a.CreatedTime)); });
  var month = monthOf(r.to), limit = settingNum('advanceMonthlyLimit');
  var adv = liveTxns(function (t) { return t.TxnType === 'advance' && monthOf(t.BusinessDate) === month; });
  var byEmp = groupBy(adv, function (t) { return t.EmployeeID; });
  return {
    range: r, funds: tx,
    totalWithdraw: sum(tx.filter(function (t) { return t.TxnType === 'withdraw'; }), function (t) { return t.Amount; }),
    totalDeposit: sum(tx.filter(function (t) { return t.TxnType === 'deposit'; }), function (t) { return t.Amount; }),
    month: month, limit: limit,
    advances: Object.keys(byEmp).map(function (e) {
      var total = sum(byEmp[e], function (t) { return t.Amount; });
      return { EmployeeID: e, Name: employeeName(e), total: total, count: byEmp[e].length, over: total > limit, items: byEmp[e].map(txnView) };
    }).sort(function (a, b) { return b.total - a.total; })
  };
}

<script>
/* core\60_alerts.js */
/* Cảnh báo, thông báo và kiểm tra định kỳ (W08, M02, CB-04, CB-11, CB-12, CB-16). */

var LEVEL_ORDER = { block: 0, warn: 1, explain: 2, remind: 3 };

function notificationView(n, user) {
  return {
    NotificationID: n.NotificationID, Code: n.Code, Level: n.Level, Message: n.Message, RecordRef: n.RecordRef,
    Status: n.Status, CreatedTime: n.CreatedTime, ResolvedBy: n.ResolvedBy ? employeeName(n.ResolvedBy) : '', ResolvedNote: n.ResolvedNote,
    read: user ? String(n.ReadBy || '').split(',').indexOf(user.EmployeeID) >= 0 : false
  };
}

/* W08 (chủ quán) */
function listAlerts(ctx, p) {
  p = p || {};
  var rows = dbAll('Notifications', function (n) {
    if (p.status && n.Status !== p.status) return false;
    if (p.code && n.Code !== p.code) return false;
    if (p.level && n.Level !== p.level) return false;
    if (p.from && String(n.CreatedTime).slice(0, 10) < p.from) return false;
    if (p.to && String(n.CreatedTime).slice(0, 10) > p.to) return false;
    return isRecipient(ctx.user, n.Recipients);
  }).sort(function (a, b) {
    return (LEVEL_ORDER[a.Level] || 9) - (LEVEL_ORDER[b.Level] || 9) || String(b.CreatedTime).localeCompare(String(a.CreatedTime));
  });
  if (p.limit) rows = rows.slice(0, p.limit);
  return rows.map(function (n) { return notificationView(n, ctx.user); });
}

function resolveAlert(ctx, p) {
  var n = dbGet('Notifications', p.notificationId);
  if (!n) fail('NOT_FOUND', 'Không tìm thấy cảnh báo');
  if (!isRecipient(ctx.user, n.Recipients)) fail('FORBIDDEN', 'Không có quyền');
  return dbUpdate(ctx, 'Notifications', n.NotificationID, { Status: 'done', ResolvedBy: ctx.user.EmployeeID, ResolvedNote: p.note || '' });
}

function resolveNotificationsFor(recordRef, ctx, note) {
  dbAll('Notifications', function (n) { return n.RecordRef === recordRef && n.Status === 'open'; }).forEach(function (n) {
    dbUpdate(ctx, 'Notifications', n.NotificationID, { Status: 'done', ResolvedBy: ctx.user.EmployeeID, ResolvedNote: note || '' });
  });
}

/* M02: thông báo của tôi (chưa xử lý, 20 mục mới nhất). */
function myNotifications(ctx) {
  return dbAll('Notifications', function (n) {
    if (n.Status !== 'open') return false;
    var list = String(n.Recipients || '').split(',');
    // Nhân viên chỉ thấy thông báo gửi đích danh; trưởng ca/chủ quán thấy cả thông báo theo vai trò.
    return list.indexOf(ctx.user.EmployeeID) >= 0 || (ctx.user.Role !== 'staff' && isRecipient(ctx.user, n.Recipients));
  }).sort(function (a, b) { return String(b.CreatedTime).localeCompare(String(a.CreatedTime)); })
    .slice(0, 20).map(function (n) { return notificationView(n, ctx.user); });
}

function markRead(ctx, p) {
  var n = dbGet('Notifications', p.notificationId);
  if (!n) return false;
  var list = String(n.ReadBy || '').split(',').filter(String);
  if (list.indexOf(ctx.user.EmployeeID) < 0) { list.push(ctx.user.EmployeeID); STORE.update('Notifications', n.NotificationID, { ReadBy: list.join(',') }); }
  // Thông báo gửi đích danh cho nhân viên: đọc xong là xong.
  if (String(n.Recipients) === ctx.user.EmployeeID) STORE.update('Notifications', n.NotificationID, { Status: 'done', ResolvedBy: ctx.user.EmployeeID, ResolvedNote: 'Đã xem' });
  return true;
}

/* Chạy định kỳ (trigger 15 phút trên Apps Script; chế độ demo chạy khi mở dashboard). */
function runChecks() {
  var now = nowMs(), today = businessDateOf(now), out = [];
  // CB-04: quá giờ kết thúc ca + thời gian chờ mà chưa ra ca.
  var wait = settingNum('checkoutWaitHours') * MS_HOUR;
  dbAll('Attendance', function (a) { return a.Status === 'open'; }).forEach(function (a) {
    if (now > shiftEndMs(a) + wait) {
      notify('CB-04', 'warn', employeeName(a.EmployeeID) + ' chưa ra ca (vào lúc ' + String(a.CheckInTime).slice(11, 16) + ' ngày ' + fmtDateVN(a.BusinessDate) + ').',
        'Attendance/' + a.AttendanceID, 'leader,' + a.EmployeeID, 'CB-04/' + a.AttendanceID);
      out.push('CB-04 ' + a.AttendanceID);
    }
  });
  // CB-11: quá giờ hạn mốc kiểm bắt buộc mà chưa có báo cáo.
  var rs = reportsOfDay(today, false);
  checkpoints().forEach(function (c) {
    if (!toBool(c.IsRequired) || !c.Deadline) return;
    var due = tsOnBusinessDate(today, c.Deadline);
    var has = rs.some(function (r) { return r.CheckpointID === c.CheckpointID; });
    if (!has && now > due) {
      notify('CB-11', now > due + 30 * 60000 ? 'warn' : 'remind', 'Chưa có báo cáo ' + c.Name + ' ngày ' + fmtDateVN(today) + ' (hạn ' + c.Deadline + ').',
        'Checkpoints/' + c.CheckpointID + '/' + today, 'leader', 'CB-11/' + c.CheckpointID + '/' + today);
      out.push('CB-11 ' + c.CheckpointID);
    }
  });
  // CB-12: ngày hôm qua đã qua giờ chốt mà chưa có báo cáo Cuối ngày (chỉ xét ngày có hoạt động).
  var close = closingCheckpoint();
  var y = addDays(today, -1);
  var yDay = dbGet('BusinessDays', y);
  if (close && yDay && !reportsOfDay(y, false).some(function (r) { return r.CheckpointID === close.CheckpointID; })) {
    notify('CB-12', 'warn', 'Ngày ' + fmtDateVN(y) + ' chưa có báo cáo Cuối ngày; doanh thu ngày chưa chốt được.', 'BusinessDays/' + y, 'admin', 'CB-12/' + y);
    out.push('CB-12 ' + y);
  }
  // CB-16: báo cáo bị trả lại quá N giờ chưa gửi lại.
  var remind = settingNum('returnedRemindHours') * MS_HOUR;
  dbAll('ShiftReports', function (r) { return r.Status === 'returned'; }).forEach(function (r) {
    if (now - parseTs(r.ApprovedTime) > remind) {
      notify('CB-16', 'remind', 'Báo cáo ' + (checkpointById(r.CheckpointID) || {}).Name + ' ngày ' + fmtDateVN(r.BusinessDate) + ' bị trả lại chưa được gửi lại.',
        'ShiftReports/' + r.ReportID, 'leader,' + r.ReporterID, 'CB-16/' + r.ReportID);
      out.push('CB-16 ' + r.ReportID);
    }
  });
  // Dọn phiên đăng nhập hết hạn được bỏ qua: bảng Sessions nhỏ, hết hạn tự vô hiệu.
  return out;
}

</script>
<script>
/* core\70_admin.js */
/* Quản trị: nhân viên (W05), cấu hình (W06), nhật ký (W09), khởi tạo dữ liệu, trang chủ M02. */

/* ---- M02 ---- */
function home(ctx) {
  var me = ctx.user.EmployeeID;
  var open = openAttendance(me);
  var bd = currentBusinessDate();
  var month = monthOf(bd);
  var rs = reportsOfDay(bd, true);
  var cps = checkpoints().map(function (c) {
    var r = rs.filter(function (x) { return x.CheckpointID === c.CheckpointID && (x.Status !== 'draft' || x.ReporterID === me); })[0];
    return { Name: c.Name, CheckpointID: c.CheckpointID, IsRequired: toBool(c.IsRequired), Deadline: c.Deadline, status: r ? r.Status : '' };
  });
  var mine = attendanceSummary(month, me)[0];
  return {
    user: ctx.user, businessDate: bd, now: nowTs(),
    open: open ? attendanceView(open) : null,
    shiftTypes: shiftTypes(true),
    checkpoints: cps,
    handovers: pendingHandovers(ctx).length,
    notifications: myNotifications(ctx),
    monthShifts: mine ? mine.totalShifts : 0,
    pendingReview: isLeader(ctx) ? pendingReports(ctx).length + pendingAttendance(ctx).length : 0,
    gpsMode: settingStr('gpsMode'),
    photo: { count: settingNum('checkoutPhotoCount'), labels: settingStr('checkoutPhotoLabels').split(',').map(function (s) { return s.trim(); }).filter(String), maxAgeMinutes: settingNum('photoMaxAgeMinutes') },
    zaloGroupLink: settingStr('zaloGroupLink'),
    store: { lat: settingNum('storeLat'), lng: settingNum('storeLng') },
    storeName: settingStr('storeName')
  };
}

/* ---- W05 ---- */
function employeeView(e) {
  var u = dbGet('Users', e.EmployeeID);
  return {
    EmployeeID: e.EmployeeID, FullName: e.FullName, DisplayName: e.DisplayName, Phone: e.Phone, Role: e.Role, RoleName: ROLES[e.Role],
    IsCashier: toBool(e.IsCashier), Status: e.Status, StartDate: e.StartDate, Aliases: e.Aliases,
    HasAccount: !!u, Locked: u ? parseTs(u.LockedUntil) > nowMs() : false, Working: !!openAttendance(e.EmployeeID)
  };
}

function listEmployees(ctx, p) {
  return dbAll('Employees').map(employeeView).sort(function (a, b) { return String(a.EmployeeID).localeCompare(String(b.EmployeeID)); });
}

function nextEmployeeId() {
  var max = 0;
  dbAll('Employees').forEach(function (e) { var n = toNum(String(e.EmployeeID).replace(/^NV/, '')); if (n > max) max = n; });
  return 'NV' + (max + 1 < 10 ? '0' : '') + (max + 1);
}

function saveEmployee(ctx, p) {
  var e = p.employee || {};
  var name = String(e.DisplayName || '').trim();
  if (!name) fail('INPUT', 'Nhập tên gọi');
  if (!ROLES[e.Role]) fail('INPUT', 'Chọn vai trò');
  var phone = normPhone(e.Phone);
  if (phone && !/^0\d{9}$/.test(phone)) fail('INPUT', 'Số điện thoại phải gồm 10 số, bắt đầu bằng 0');
  var id = e.EmployeeID || nextEmployeeId();
  if (phone) {
    var dupPhone = dbAll('Employees', function (x) { return normPhone(x.Phone) === phone && x.EmployeeID !== id; });
    if (dupPhone.length) fail('DUP_PHONE', 'Số điện thoại đã dùng cho ' + dupPhone[0].DisplayName);
  }
  var warnings = [];
  var dupName = dbAll('Employees', function (x) { return normName(x.DisplayName) === normName(name) && x.EmployeeID !== id; });
  if (dupName.length) warnings.push('Tên gọi "' + name + '" trùng với ' + dupName[0].EmployeeID + '; nên thêm chữ phân biệt.');
  var row = {
    FullName: String(e.FullName || '').trim(), DisplayName: name, Phone: phone, Role: e.Role,
    IsCashier: e.Role !== 'staff' ? true : !!e.IsCashier, StartDate: e.StartDate || '', Aliases: e.Aliases || ''
  };
  var tempPin = null, existing = dbGet('Employees', id);
  if (existing) {
    dbUpdate(ctx, 'Employees', id, row);
    var u = dbGet('Users', id);
    if (u && phone !== normPhone(u.Phone)) dbUpdate(ctx, 'Users', id, { Phone: phone });
    if (!u && phone) tempPin = setAccount(ctx, id, phone);
  } else {
    row.EmployeeID = id; row.Status = 'active';
    dbInsert(ctx, 'Employees', row);
    if (phone) tempPin = setAccount(ctx, id, phone);
  }
  return { employee: employeeView(dbGet('Employees', id)), tempPin: tempPin, warnings: warnings };
}

function resetPin(ctx, p) {
  var e = dbGet('Employees', p.employeeId);
  if (!e) fail('NOT_FOUND', 'Không tìm thấy nhân viên');
  if (!normPhone(e.Phone)) fail('INPUT', 'Nhập số điện thoại cho nhân viên trước');
  var pin = setAccount(ctx, e.EmployeeID, e.Phone);
  resolveNotificationsFor('Users/' + e.EmployeeID, ctx, 'Đã đặt lại PIN');
  return { tempPin: pin };
}

function setEmployeeActive(ctx, p) {
  var e = dbGet('Employees', p.employeeId);
  if (!e) fail('NOT_FOUND', 'Không tìm thấy nhân viên');
  if (e.EmployeeID === ctx.user.EmployeeID) fail('SELF', 'Không tự khóa tài khoản của mình');
  if (!p.active && openAttendance(e.EmployeeID)) fail('OPEN', e.DisplayName + ' đang trong ca. Đóng ca trước khi khóa.');
  dbUpdate(ctx, 'Employees', e.EmployeeID, { Status: p.active ? 'active' : 'inactive' });
  if (dbGet('Users', e.EmployeeID)) dbUpdate(ctx, 'Users', e.EmployeeID, { IsActive: !!p.active });
  return employeeView(dbGet('Employees', e.EmployeeID));
}

/* ---- W06 ---- */
function getConfig(ctx) {
  return {
    settings: DEFAULT_SETTINGS.map(function (d) { return { Key: d[0], Label: d[2], Value: settingStr(d[0]) }; }),
    shiftTypes: shiftTypes(false), checkpoints: checkpoints(), categories: dbAll('ExpenseCategories')
  };
}

function saveSettings(ctx, p) {
  var vals = p.values || {};
  DEFAULT_SETTINGS.forEach(function (d) {
    if (vals[d[0]] === undefined || d[0] === 'imageFolderId') return;
    var v = String(vals[d[0]]).trim();
    if (d[0] === 'gpsMode' && ['off', 'warn', 'block'].indexOf(v) < 0) fail('INPUT', 'Chế độ GPS chỉ nhận off / warn / block');
    var row = dbGet('Settings', d[0]);
    if (row) dbUpdate(ctx, 'Settings', d[0], { Value: v, UpdatedBy: ctx.user.EmployeeID, UpdatedTime: nowTs() });
    else dbInsert(ctx, 'Settings', { Key: d[0], Value: v, Label: d[2], UpdatedBy: ctx.user.EmployeeID, UpdatedTime: nowTs() });
  });
  return getConfig(ctx);
}

function validHHmm(s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s || '')); }

function saveCatalog(ctx, p) {
  var t = p.table, r = p.row || {};
  if (t === 'ShiftTypes') {
    if (!String(r.Name || '').trim()) fail('INPUT', 'Nhập tên ca');
    if (!validHHmm(r.StartTime) || !validHHmm(r.EndTime)) fail('INPUT', 'Giờ phải có dạng HH:mm');
    if (!(toNum(r.WorkUnits) > 0)) fail('INPUT', 'Công quy đổi phải lớn hơn 0');
    var st = { Name: r.Name, StartTime: r.StartTime, EndTime: r.EndTime, WorkUnits: toNum(r.WorkUnits), IsActive: !!r.IsActive, SortOrder: toNum(r.SortOrder) };
    if (r.ShiftTypeID && dbGet(t, r.ShiftTypeID)) dbUpdate(ctx, t, r.ShiftTypeID, st);
    else { st.ShiftTypeID = 'CA' + PLATFORM.uuid().slice(0, 4).toUpperCase(); dbInsert(ctx, t, st); }
  } else if (t === 'Checkpoints') {
    if (!r.CheckpointID || !dbGet(t, r.CheckpointID)) fail('INPUT', 'Chỉ sửa được mốc kiểm có sẵn');
    if (!validHHmm(r.Deadline)) fail('INPUT', 'Giờ hạn phải có dạng HH:mm');
    dbUpdate(ctx, t, r.CheckpointID, { Name: r.Name, Deadline: r.Deadline, IsRequired: !!r.IsRequired });
  } else if (t === 'ExpenseCategories') {
    if (!String(r.Name || '').trim()) fail('INPUT', 'Nhập tên nhóm chi');
    if (r.CategoryID && dbGet(t, r.CategoryID)) dbUpdate(ctx, t, r.CategoryID, { Name: r.Name, IsActive: !!r.IsActive });
    else dbInsert(ctx, t, { CategoryID: 'NC' + PLATFORM.uuid().slice(0, 4).toUpperCase(), Name: r.Name, IsActive: true });
  } else fail('INPUT', 'Bảng không hợp lệ');
  return getConfig(ctx);
}

/* ---- W09 ---- */
function auditLog(ctx, p) {
  p = p || {};
  var rows = dbAll('AuditLog', function (l) {
    if (p.userId && l.UserID !== p.userId) return false;
    if (p.table && l.TableName !== p.table) return false;
    if (p.from && String(l.Time).slice(0, 10) < p.from) return false;
    if (p.to && String(l.Time).slice(0, 10) > p.to) return false;
    if (p.q && (l.RecordID + l.Action + l.OldValue + l.NewValue).toLowerCase().indexOf(String(p.q).toLowerCase()) < 0) return false;
    return true;
  }).sort(function (a, b) { return String(b.Time).localeCompare(String(a.Time)); });
  var total = rows.length;
  return {
    total: total, rows: rows.slice(0, p.limit || 200).map(function (l) {
      return { Time: l.Time, User: employeeName(l.UserID), UserID: l.UserID, TableName: l.TableName, RecordID: l.RecordID, Action: l.Action, OldValue: l.OldValue, NewValue: l.NewValue };
    })
  };
}

/* ---- Khởi tạo dữ liệu mặc định (chạy 1 lần) ---- */
function seedDefaults(adminPhone, adminPin) {
  var ctx = SYSTEM_CTX;
  DEFAULT_SETTINGS.forEach(function (d) { if (!dbGet('Settings', d[0])) dbInsert(ctx, 'Settings', { Key: d[0], Value: d[1], Label: d[2], UpdatedBy: 'SYSTEM', UpdatedTime: nowTs() }); });
  DEFAULT_SHIFT_TYPES.forEach(function (s) { if (!dbGet('ShiftTypes', s.ShiftTypeID)) dbInsert(ctx, 'ShiftTypes', s); });
  DEFAULT_CHECKPOINTS.forEach(function (c) { if (!dbGet('Checkpoints', c.CheckpointID)) dbInsert(ctx, 'Checkpoints', c); });
  DEFAULT_CATEGORIES.forEach(function (c) { if (!dbGet('ExpenseCategories', c.CategoryID)) dbInsert(ctx, 'ExpenseCategories', c); });
  DEFAULT_EMPLOYEES.forEach(function (e) {
    if (!dbGet('Employees', e[0])) dbInsert(ctx, 'Employees', { EmployeeID: e[0], FullName: '', DisplayName: e[1], Phone: '', Role: e[2], IsCashier: e[3], Status: 'active', StartDate: '', Aliases: e[4] });
  });
  if (!dbGet('Employees', 'ADMIN')) {
    dbInsert(ctx, 'Employees', { EmployeeID: 'ADMIN', FullName: 'Chủ quán', DisplayName: 'Chủ quán', Phone: normPhone(adminPhone), Role: 'admin', IsCashier: true, Status: 'active' });
  }
  if (!dbGet('Users', 'ADMIN')) {
    if (!/^0\d{9}$/.test(normPhone(adminPhone)) || !validPin(adminPin)) fail('INPUT', 'Cần SĐT 10 số và PIN 6 số cho tài khoản chủ quán');
    setAccount(ctx, 'ADMIN', adminPhone, adminPin);
  }
  return true;
}
