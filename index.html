<script>
/* core\80_import.js */
/* Nhập dữ liệu lịch sử từ 2 file Excel Google Form (mục 5.3 SRS).
 * data = { revenue: [{ts,date,label,cash,transfer,category,reporter,expense,description}], attendance: [{ts,name,status,shift}] } */

var IMPORT_CHECKPOINT = { 'đầu ca sáng': 'OPEN', 'ca trưa': 'NOON', 'ca chiều': 'AFTERNOON', 'cuối ca tối': 'CLOSE' };
var IMPORT_SHIFT = { 'sáng': 'SANG', 'trưa': 'TRUA', 'tối': 'TOI', 'trưa - tối': 'TRUATOI', 'trưa – tối': 'TRUATOI' };

function employeeIndex() {
  var idx = {};
  dbAll('Employees').forEach(function (e) {
    idx[normName(e.DisplayName)] = e.EmployeeID;
    String(e.Aliases || '').split(',').forEach(function (a) { if (a.trim()) idx[normName(a)] = e.EmployeeID; });
  });
  return idx;
}

function importHistory(ctx, data) {
  if (dbAll('ShiftReports', function (r) { return r.Source === 'import'; }).length ||
      dbAll('Attendance', function (a) { return a.Source === 'import'; }).length) {
    fail('DONE', 'Dữ liệu lịch sử đã được nhập trước đó.');
  }
  var ictx = { user: ctx.user, noAudit: true };
  var issues = [];
  function issue(kind, bd, msg) { issues.push({ kind: kind, date: bd, message: msg }); }
  var emp = employeeIndex();
  function empId(name, bdForIssue) {
    var id = emp[normName(name)];
    if (!id && name) issue('Tên', bdForIssue, 'Không khớp nhân viên "' + name + '"');
    return id || '';
  }

  /* ---- Chấm công: ghép Vào/Ra theo từng người ---- */
  var att = (data.attendance || []).slice().sort(function (a, b) { return String(a.ts).localeCompare(String(b.ts)); });
  var open = {}, attCount = 0, minH = settingNum('minShiftHours'), maxH = settingNum('maxShiftHours');
  function writeAtt(o) { dbInsert(ictx, 'Attendance', o); attCount++; }
  function closeMissing(o) {
    o.Status = 'review'; o.Note = 'Nhập từ Excel: thiếu Ra ca';
    writeAtt(o);
  }
  att.forEach(function (r) {
    var ms = parseTs(r.ts), id = empId(r.name, String(r.ts).slice(0, 10));
    if (!id || isNaN(ms)) return;
    var shift = IMPORT_SHIFT[normName(r.shift)] || 'TOI';
    var isIn = normName(r.status) === 'vào ca';
    var cur = open[id];
    if (isIn) {
      if (cur) closeMissing(cur);
      var bd = businessDateOf(ms);
      open[id] = { AttendanceID: uid('A'), EmployeeID: id, ShiftTypeID: shift, BusinessDate: bd, CheckInTime: fmtTs(ms), LateMinutes: lateMinutesOf(bd, shift, ms), Source: 'import' };
    } else if (cur && ms - parseTs(cur.CheckInTime) < 20 * MS_HOUR) {
      cur.CheckOutTime = fmtTs(ms);
      cur.WorkHours = workHoursOf(parseTs(cur.CheckInTime), ms);
      cur.Status = cur.WorkHours < minH || cur.WorkHours > maxH ? 'review' : 'done';
      cur.Note = 'Nhập từ Excel' + (shift !== cur.ShiftTypeID ? '; lúc ra chọn ca ' + r.shift : '') + (cur.Status === 'review' ? '; giờ làm bất thường' : '');
      writeAtt(cur);
      delete open[id];
    } else {
      if (cur) { closeMissing(cur); delete open[id]; }
      writeAtt({ AttendanceID: uid('A'), EmployeeID: id, ShiftTypeID: shift, BusinessDate: businessDateOf(ms), CheckInTime: '', CheckOutTime: fmtTs(ms), Status: 'review', Source: 'import', Note: 'Nhập từ Excel: thiếu Vào ca' });
    }
  });
  Object.keys(open).forEach(function (id) { closeMissing(open[id]); });
  var attReview = dbAll('Attendance', function (a) { return a.Source === 'import' && a.Status === 'review'; }).length;
  if (attReview) issue('Chấm công', '', attReview + ' lượt thiếu Vào/Ra hoặc giờ bất thường, cần trưởng ca/chủ quán xác nhận ở màn Duyệt chấm công');

  /* ---- Báo cáo ca: mỗi (ngày, mốc) giữ bản nộp sau cùng ---- */
  var slots = {}, rows = [], openCount = {};
  (data.revenue || []).forEach(function (r) {
    var cp = IMPORT_CHECKPOINT[normName(r.label)];
    if (!cp) return;
    var ms = parseTs(r.ts), bd = String(r.date || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(bd) || Math.abs(parseTs(bd) - parseTs(fmtTs(ms).slice(0, 10))) > 7 * MS_DAY) {
      var fixed = cp === 'OPEN' ? addDays(businessDateOf(ms), 1) : businessDateOf(ms);
      issue('Ngày', fixed, 'Ngày báo cáo ghi ' + fmtDateVN(bd) + ', nộp lúc ' + r.ts + ' → sửa thành ' + fmtDateVN(fixed));
      bd = fixed;
    }
    rows.push({ r: r, cp: cp, bd: bd, ms: ms });
    if (cp === 'OPEN') openCount[bd] = (openCount[bd] || 0) + 1;
  });
  rows.forEach(function (x) {
    var r = x.r, cp = x.cp, bd = x.bd;
    // Báo cáo Đầu ngày nộp buổi sáng, ghi ngày hôm trước, mà ngày đó đã có báo cáo Đầu ngày khác
    // và ngày nộp thì chưa có → nhân viên chọn nhầm ngày, tính cho ngày nộp.
    if (cp === 'OPEN') {
      var tsDate = fmtTs(x.ms).slice(0, 10);
      if (+fmtTs(x.ms).slice(11, 13) < 12 && bd < tsDate && openCount[bd] > 1 && !openCount[tsDate]) {
        issue('Ngày', tsDate, 'Báo cáo Đầu ngày ghi ngày ' + fmtDateVN(bd) + ' (đã có bản khác) nhưng nộp sáng ' + r.ts + ' → tính cho ngày ' + fmtDateVN(tsDate));
        openCount[bd]--; openCount[tsDate] = 1;
        bd = tsDate;
      }
    }
    var key = bd + '|' + cp;
    if (slots[key]) issue('Trùng', bd, 'Mốc ' + r.label + ' có nhiều bản nộp; giữ bản ' + (slots[key].ts > r.ts ? slots[key].ts : r.ts));
    if (!slots[key] || r.ts > slots[key].ts) slots[key] = { r: r, bd: bd, cp: cp, ts: r.ts };
  });
  var keys = Object.keys(slots).sort();
  var repCount = 0, txCount = 0, days = {};
  var zero = settingNum('missingZeroThreshold');
  var beforeOpen = []; // khoản ghi ở báo cáo Đầu ngày = tiền ra/vào két sau khi đóng cửa hôm trước
  keys.forEach(function (k) {
    var s = slots[k], r = s.r, bd = s.bd;
    var reporter = empId(r.reporter, bd) || 'SYSTEM';
    var cash = toNum(r.cash), transfer = s.cp === 'OPEN' ? 0 : toNum(r.transfer);
    if (s.cp === 'OPEN' && toNum(r.transfer)) transfer = toNum(r.transfer);
    if (cash > 0 && cash < zero) issue('CB-06', bd, 'Tiền két ' + fmtMoney(cash) + ' đ (' + r.label + ') nghi thiếu số 0');
    if (transfer > 0 && transfer < zero) issue('CB-06', bd, 'Tiền CK ' + fmtMoney(transfer) + ' đ (' + r.label + ') nghi thiếu số 0');
    var rep = dbInsert(ictx, 'ShiftReports', {
      ReportID: uid('R'), BusinessDate: bd, CheckpointID: s.cp, CashCounted: cash, TransferAmount: transfer,
      ReporterID: reporter, CreatedTime: r.ts, SubmittedTime: r.ts, Status: 'approved', ApproverID: 'SYSTEM', ApprovedTime: r.ts, Source: 'import'
    });
    repCount++; days[bd] = true;

    // Khoản chi: số tiền ở cột Tổng tiền chi; vài dòng đầu ghi số tiền vào cột Khoản chi.
    var amount = toNum(r.expense), cats = String(r.category || '');
    if (!amount && /^[\d.]+$/.test(cats) && toNum(cats) > 0) { amount = toNum(cats); cats = ''; }
    if (/^[\d.]+$/.test(cats)) cats = '';
    if (amount > 0) {
      var list = cats.replace(/Trả phí, ship\.\.\./g, 'SHIP').split(',').map(function (x) { return x.trim(); }).filter(String);
      var desc = String(r.description || '').trim() || '(không ghi nội dung)';
      var low = normName(desc);
      var t = { TxnType: 'expense', CategoryID: 'KHAC', EmployeeID: '', Note: 'Nhập từ Excel' + (cats ? ': ' + cats : '') };
      if (list.length > 1) {
        t.Note += ' | Cần tách theo nội dung';
        issue('Tách chi', bd, fmtMoney(amount) + ' đ gộp nhiều loại (' + cats + '): ' + desc);
      } else if (list[0] === 'Nguyên liệu') t.CategoryID = 'NGUYENLIEU';
      else if (list[0] === 'Vật tư tiêu hao') t.CategoryID = 'VATTU';
      else if (list[0] === 'SHIP') t.CategoryID = 'SHIP';
      else if (list[0] === 'Ứng lương') { t.TxnType = 'advance'; t.CategoryID = ''; issue('Ứng lương', bd, fmtMoney(amount) + ' đ chưa rõ người ứng: ' + desc); }
      else if (list[0] === 'Nhập quỹ tiền mặt' || /(cô 3|cô ba|anh tín|chú|quỹ).*(lấy)|^quỹ$|lấy$/.test(low)) { t.TxnType = 'withdraw'; t.CategoryID = ''; }
      if (t.TxnType === 'expense' && list.length <= 1 && /dư/.test(low) && /(ck|chuyển|chuyện)/.test(low) && !/,/.test(desc)) { t.TxnType = 'refund'; t.CategoryID = ''; }
      if (s.cp === 'OPEN') {
        if (t.TxnType === 'expense' && !list.length) { t.TxnType = 'withdraw'; t.CategoryID = ''; }
        t.Note += ' | Ghi ở báo cáo Đầu ngày: tiền lấy ra sau khi đóng cửa hôm trước';
        beforeOpen.push({ rep: rep, bd: bd, t: t, amount: amount, desc: desc, reporter: reporter, ts: r.ts });
        return;
      }
      dbInsert(ictx, 'CashTransactions', {
        TxnID: uid('T'), ReportID: rep.ReportID, BusinessDate: bd, TxnType: t.TxnType, CategoryID: t.CategoryID, Amount: amount,
        Description: desc, EmployeeID: t.EmployeeID, CreatedBy: reporter, CreatedTime: r.ts, ApprovalStatus: 'approved', AfterClose: false, Deleted: false, Note: t.Note
      });
      txCount++;
    }
  });

  beforeOpen.forEach(function (x) {
    var day = afterCloseDayFor(x.bd);
    issue('Đầu ngày', x.bd, fmtMoney(x.amount) + ' đ ("' + x.desc + '") ghi ở báo cáo Đầu ngày → tính là tiền lấy ra sau khi đóng cửa ngày ' + fmtDateVN(day) + ', không cộng vào doanh thu ngày ' + fmtDateVN(x.bd));
    dbInsert(ictx, 'CashTransactions', {
      TxnID: uid('T'), ReportID: x.rep.ReportID, BusinessDate: day, TxnType: x.t.TxnType, CategoryID: x.t.CategoryID, Amount: x.amount,
      Description: x.desc, EmployeeID: '', CreatedBy: x.reporter, CreatedTime: x.ts, ApprovalStatus: 'approved', AfterClose: true, Deleted: false, Note: x.t.Note
    });
    txCount++;
  });

  // Két chuyển sang và chênh lệch đầu ngày (F-01, F-06), rồi tính doanh thu từng ngày theo thứ tự.
  var dayList = Object.keys(days).sort();
  dayList.forEach(function (bd) {
    var openRep = dbAll('ShiftReports', function (x) { return x.BusinessDate === bd && x.CheckpointID === 'OPEN' && x.Source === 'import'; })[0];
    if (openRep) {
      var base = carryForOpening(bd, openRep.ReportID), expectedOpen = carryForOpening(bd);
      if (base !== null) STORE.update('ShiftReports', openRep.ReportID, { CashCarried: base, Difference: toNum(openRep.CashCounted) - expectedOpen });
    }
    recomputeDay(bd);
  });
  var noClose = dayList.filter(function (bd) { return !toBool((dbGet('BusinessDays', bd) || {}).HasClosing); });
  if (noClose.length) issue('CB-12', '', noClose.length + ' ngày không có báo cáo Cuối ngày: ' + noClose.map(fmtDateVN).join(', '));
  var noOpen = dayList.filter(function (bd) { return !dbAll('ShiftReports', function (x) { return x.BusinessDate === bd && x.CheckpointID === 'OPEN'; }).length; });
  if (noOpen.length) issue('Thiếu đầu ngày', '', noOpen.length + ' ngày không có báo cáo Đầu ngày; két đầu lấy theo két cuối ngày trước (F-01)');

  audit(ctx, 'Import', 'history', 'Nhập dữ liệu Excel', '', attCount + ' lượt chấm công, ' + repCount + ' báo cáo, ' + txCount + ' giao dịch');
  notify('IMPORT', 'remind', 'Đã nhập lịch sử Excel: ' + attCount + ' lượt chấm công, ' + repCount + ' báo cáo ca, ' + txCount + ' giao dịch; ' + issues.length + ' điểm cần xem lại.', 'Import/history', 'admin', 'IMPORT');
  return { attendance: attCount, reports: repCount, transactions: txCount, days: dayList.length, issues: issues };
}

<script>
/* core\90_api.js */
/* Cổng API duy nhất: apiDispatch(action, payload, token) → { ok, data } | { ok:false, code, error, extra }.
 * Phân quyền theo bảng 3.1 SRS. 'write' = hành động ghi dữ liệu (môi trường chạy bọc trong khóa ghi). */

var API = {
  // công khai

<script>
/* web\demo-host.js */
/* Chế độ demo: chạy toàn bộ lõi nghiệp vụ trong trình duyệt, dữ liệu lưu localStorage.
 * Dùng để chạy thử, nghiệm thu giao diện trước khi triển khai lên Google Sheet. */
var DEMO_PREFIX = 'bt_db_';

/* Tài khoản demo (chỉ tồn tại trong chế độ demo, không dùng khi triển khai thật). */
var DEMO_ACCOUNTS = [
  { id: 'ADMIN', phone: '0900000001', pin: '111111', label: 'Chủ quán' },
  { id: 'NV07', phone: '0900000007', pin: '111111', label: 'Tâm – Trưởng ca' },
  { id: 'NV04', phone: '0900000004', pin: '111111', label: 'Duyên – Thu ngân' },
  { id: 'NV02', phone: '0900000002', pin: '111111', label: 'Phúc – Nhân viên' }
];

var PLATFORM = {
  now: function () { return Date.now(); },
  uuid: function () {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  },
  withLock: function (fn) { return fn(); },
  saveImage: function (dataUrl, name) {
    if (!/^data:image\//.test(String(dataUrl))) fail('INPUT', 'Ảnh không hợp lệ');
    var id = 'img' + Date.now() + Math.floor(Math.random() * 1000);
    try { localStorage.setItem('bt_img_' + id, dataUrl); } catch (e) { fail('FULL', 'Bộ nhớ demo của trình duyệt đã đầy'); }
    return 'local:' + id;
  },
  sendMail: function () { /* demo: không gửi email */ }
};

window.resolveImage = function (url) {
  if (String(url).indexOf('local:') === 0) return localStorage.getItem('bt_img_' + String(url).slice(6)) || '';
  return url;
};

var LocalBackend = {
  load: function (table) {
    try { return JSON.parse(localStorage.getItem(DEMO_PREFIX + table) || '[]'); } catch (e) { return []; }
  },
  save: function (table, inserts, updates, allRows) {
    var rows = allRows;
    if (!rows) { rows = this.load(table); inserts.forEach(function (r) { rows.push(r); }); }
    localStorage.setItem(DEMO_PREFIX + table, JSON.stringify(rows));
  }
};

var STORE = createBufferedStore(LocalBackend);

function demoIsSeeded() { return !!localStorage.getItem(DEMO_PREFIX + 'Employees'); }

function demoSeed(withHistory) {
  Object.keys(SCHEMA).forEach(function (t) { localStorage.removeItem(DEMO_PREFIX + t); });
  Object.keys(localStorage).forEach(function (k) { if (k.indexOf('bt_img_') === 0) localStorage.removeItem(k); });
  var admin = DEMO_ACCOUNTS[0];
  seedDefaults(admin.phone, admin.pin);
  DEMO_ACCOUNTS.forEach(function (a) {
    STORE.update('Employees', a.id, { Phone: a.phone });
    setAccount(SYSTEM_CTX, a.id, a.phone, a.pin);
    STORE.update('Users', a.id, { MustChange: false });
  });
  STORE.commit();
  if (withHistory && window.HISTORY_DATA) {
    var adminUser = { EmployeeID: 'ADMIN', Role: 'admin', DisplayName: 'Chủ quán' };
    var res = importHistory({ user: adminUser }, window.HISTORY_DATA);
    STORE.commit();
    return res;
  }
  return null;
}

<script>
/* web\api.js */
/* Kết nối giao diện ↔ máy chủ.
 *  - 'gas'  : trang chạy trong Google Apps Script → google.script.run.api(...)
 *  - 'http' : trang đặt nơi khác → POST tới URL web app Apps Script (APP_CONFIG.apiUrl)
 *  - 'demo' : chạy toàn bộ lõi nghiệp vụ ngay trong trình duyệt, dữ liệu ở localStorage
 * Chấm công khi mất mạng: xếp hàng trên máy, giữ giờ bấm thật, tự gửi lại khi có mạng (NFR-04). */
(function () {
  var cfg = window.APP_CONFIG || {};
  var mode = cfg.mode || (window.google && google.script && google.script.run ? 'gas' : 'demo');
  var QUEUE_KEY = 'bt_offline_queue';

  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function token() { var s = store('bt_session'); return s ? s.token : ''; }

  function transport(action, payload) {
    var tk = token();
    if (mode === 'demo') {
      return new Promise(function (resolve) { setTimeout(function () { resolve(runApiRequest(action, payload, tk)); }, 60); });
    }
    if (mode === 'gas') {
      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(function (s) { resolve(JSON.parse(s)); }).withFailureHandler(reject).api(action, payload, tk);
      });
    }
    return fetch(cfg.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: payload, token: tk }) })
      .then(function (r) { return r.json(); });
  }

  function isNetworkError(e) { return !navigator.onLine || (e && /network|failed to fetch|NetworkError|Load failed/i.test(String(e.message || e))); }

  function call(action, payload) {
    return transport(action, payload || {}).then(function (res) {
      if (!res.ok && res.code === 'AUTH') { localStorage.removeItem('bt_session'); location.hash = '#/login'; }
      if (!res.ok && res.code === 'MUST_CHANGE') location.hash = '#/change-pin';
      return res;
    }, function (e) {
      return { ok: false, code: isNetworkError(e) ? 'OFFLINE' : 'SERVER', error: isNetworkError(e) ? 'Mất kết nối mạng.' : 'Lỗi kết nối: ' + (e && e.message ? e.message : e) };
    });
  }

  /* Chấm công: mất mạng thì lưu hàng đợi kèm giờ bấm thật. */
  function callQueued(action, payload) {
    payload = payload || {};
    return call(action, payload).then(function (res) {
      if (res.code !== 'OFFLINE') return res;
      var q = store(QUEUE_KEY) || [];
      payload.offlineAt = Date.now();
      q.push({ action: action, payload: payload });
      store(QUEUE_KEY, q);
      return { ok: true, queued: true, data: { warnings: ['Đang lưu tạm trên máy, sẽ tự gửi khi có mạng'] } };
    });
  }

  function flushQueue() {
    var q = store(QUEUE_KEY) || [];
    if (!q.length) return Promise.resolve(0);
    var item = q[0];
    return call(item.action, item.payload).then(function (res) {
      if (res.code === 'OFFLINE') return 0;
      q.shift(); store(QUEUE_KEY, q);
      if (!res.ok) UI.toast('Gửi chấm công lưu tạm thất bại: ' + res.error, 'err');
      else UI.toast('Đã gửi chấm công lưu tạm', 'ok');
      return flushQueue().then(function (n) { return n + 1; });
    });
  }
  window.addEventListener('online', function () { flushQueue().then(function (n) { if (n && window.App) App.refresh(); }); });

  window.Api = { call: call, callQueued: callQueued, flushQueue: flushQueue, mode: mode, queueLength: function () { return (store(QUEUE_KEY) || []).length; } };
})();

<script>
/* web\xlsx-lite.js */
/* Đọc trang tính đầu tiên của file .xlsx ngay trên trình duyệt (không cần thư viện):
 * giải nén ZIP bằng DecompressionStream('deflate-raw') rồi đọc XML. */
(function () {
  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }

  function unzip(buf) {

    for (var i = b.length - 22; i >= Math.max(0, b.length - 65557); i--) { if (u32(b, i) === 0x06054b50) { eocd = i; break; } }

      var method = u16(b, off + 10), csize = u32(b, off + 20), nlen = u16(b, off + 28), elen = u16(b, off + 30), clen = u16(b, off + 32), lho = u32(b, off + 42);

      off += 46 + nlen + elen + clen;
    }
    return {
      read: function (name) {
        var e = entries[name];
        if (!e) return Promise.resolve(null);
        var start = e.lho + 30 + u16(b, e.lho + 26) + u16(b, e.lho + 28);
        var data = b.subarray(start, start + e.csize);

        var stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return new Response(stream).text();
      }
    };
  }

  function colOf(ref) { return String(ref).replace(/\d+/g, ''); }

  function readFirstSheet(file) {
    return file.arrayBuffer().then(function (buf) {
      var z = unzip(buf);
      return Promise.all([z.read('xl/sharedStrings.xml'), z.read('xl/worksheets/sheet1.xml')]).then(function (xs) {

  function serialTs(s) {

    var d = new Date(Math.round((Number(s) - 25569) * 86400000));
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
  }

      revenue: rev.slice(1).filter(function (r) { return r.A; }).map(function (r) {
        return { ts: serialTs(r.A), date: serialTs(r.B).slice(0, 10), label: String(r.C || '').trim(), cash: r.D, transfer: r.E, category: String(r.F || '').trim(), reporter: String(r.G || '').trim(), expense: r.H, description: String(r.I || '').trim() };
      }),
      attendance: att.slice(1).filter(function (r) { return r.A; }).map(function (r) {

      })

(function () {

  function user() { var s = session(); return s ? s.user : null; }
  function isLeader() { var u = user(); return u && (u.Role === 'leader' || u.Role === 'admin'); }
  function isAdmin() { var u = user(); return u && u.Role === 'admin'; }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

  /* ---------- M03 Chấm công: định vị, ảnh hiện trạng khi ra ca, chia sẻ vào nhóm Zalo ---------- */
  /* Lấy vị trí kèm lý do khi thất bại, để báo đúng nguyên nhân và hướng dẫn nhân viên bật lại. */
  var LOC_REASON = {
    frame: { short: 'trang đang mở trong khung không được phép dùng định vị',
      long: 'Trang này đang mở bên trong khung của trang khác (link demo claude.ai hoặc link Apps Script), nơi trình duyệt cấm dùng định vị. Hãy mở bằng link chính thức của quán (trang riêng) để lấy được vị trí.' },

    timeout: { short: 'không bắt được tín hiệu GPS', long: 'Chưa bắt được tín hiệu GPS. Đứng gần cửa hoặc chỗ thoáng rồi bấm Thử lại.' },
    insecure: { short: 'trang không chạy HTTPS', long: 'Trang không chạy HTTPS nên trình duyệt không cho dùng định vị. Hãy mở bằng link https của quán.' },
    unsupported: { short: 'trình duyệt không hỗ trợ định vị', long: 'Trình duyệt này không hỗ trợ định vị. Hãy dùng Chrome (Android) hoặc Safari (iPhone).' }
  };

  function readLocation() {
    return new Promise(function (resolve) {
      if (!window.isSecureContext) return resolve({ reason: 'insecure' });

  /* Khối trạng thái vị trí trên màn chấm công: thông báo, hướng dẫn bật, nút Thử lại; bản demo có vị trí giả lập. */
  function makeLocator(d) {
    var state = { loc: null, reason: '', simulated: false };
    var el = h('div', { class: 'stack', style: { marginTop: '6px' } });
    var active = d.gpsMode === 'warn' || d.gpsMode === 'block';
    function guide() {
      return h('details', { class: 'small' }, h('summary', null, 'Cách bật vị trí'),
        h('p', null, h('strong', null, 'Android (Chrome): '), 'Kéo thanh thông báo, bật Vị trí. Trong Chrome bấm biểu tượng bên trái địa chỉ trang → Quyền → Vị trí → Cho phép. Tải lại trang.'),
        h('p', null, h('strong', null, 'iPhone (Safari): '), 'Cài đặt → Quyền riêng tư & Bảo mật → Dịch vụ định vị: Bật; mục Trang web Safari: "Khi dùng ứng dụng". Trong Safari bấm "aA" → Cài đặt trang web → Vị trí → Cho phép.'));
    }
    function draw() {
      clear(el);
      if (!active) return;
      if (state.loc) {
        el.appendChild(h('div', { class: 'small muted' }, (state.simulated ? 'Đang dùng vị trí giả lập tại quán (chỉ bản demo)' : 'Đã lấy vị trí') + ' (±' + Math.round(state.loc.acc || 0) + ' m)'));
        return;
      }
      if (!state.reason) { el.appendChild(h('div', { class: 'small muted' }, 'Đang lấy vị trí…')); return; }
      var r = LOC_REASON[state.reason] || LOC_REASON.unavailable;
      el.appendChild(h('div', { class: 'alert warn small' }, h('strong', null, 'Chưa lấy được vị trí. '), r.long,
        h('div', null, 'Vẫn chấm công được, nhưng chủ quán sẽ nhận cảnh báo.')));
      if (state.reason !== 'frame' && state.reason !== 'insecure' && state.reason !== 'unsupported') el.appendChild(guide());
      var row = h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn small', onclick: function () { refresh(); } }, '↻ Thử lại'));
      if (Api.mode === 'demo' && d.store && d.store.lat) {
        row.appendChild(h('button', { type: 'button', class: 'btn small', onclick: function () {

          state.loc = { lat: d.store.lat + (Math.random() - 0.5) * 0.0002, lng: d.store.lng + (Math.random() - 0.5) * 0.0002, acc: 20 };

    }
    draw();
    refresh();
    return {
      el: el, refresh: refresh,
      get: function () { return state.loc; },

  /* Ra ca: bắt buộc đủ ảnh hiện trạng theo từng góc, ảnh đóng dấu tên – giờ – góc – vị trí. */
  function buildCheckout(body, d, nowEl, L) {

      if (!cp.IsOpening && transfer.get() === '') { err.textContent = 'Nhập tiền CK (không có thì nhập 0)'; return; }
      var lines = ['Mốc: ' + cp.Name + ' · ngày ' + fmtDateVN(d.businessDate), 'Tiền mặt: ' + money(c) + ' đ'];
      if (!cp.IsOpening) lines.push('Tiền CK: ' + money(transfer.get()) + ' đ');
      if (txns.length) lines.push(txns.length + ' giao dịch, tổng ' + money(txns.reduce(function (a, t) { return a + Number(t.Amount); }, 0)) + ' đ');
      UI.confirmBox('Gửi báo cáo?', lines, 'Gửi báo cáo').then(function (ok) { if (ok) save(true); });
    };
  }

  function txnModal(d) {
    var type = 'expense';
    var types = ['expense', 'advance', 'refund'].concat(d.canFund ? ['withdraw', 'deposit'] : []);
    var seg = h('div', { class: 'seg' });
    var cat = UI.select([{ value: '', label: '— Chọn nhóm chi —' }].concat(d.categories.map(function (c) { return { value: c.CategoryID, label: c.Name }; })), '');
    var emp = UI.select([{ value: '', label: '— Chọn nhân viên —' }].concat(d.employees.map(function (e) { return { value: e.EmployeeID, label: e.Name }; })), '');
    var empInfo = h('div', { class: 'small muted' });
    var amount = UI.moneyInput({ onchange: function () { hint(); } });
    var desc = h('input', { type: 'text', placeholder: 'Vd: Mua bánh mì' });
    var img = '', imgLbl = h('span', { class: 'small muted' });
    var warn = h('div');
    var err = h('div', { class: 'field-err' });
    var catField = UI.field('Nhóm chi', cat), empField = UI.field('Nhân viên ứng', emp);
    function draw() {
      clear(seg);
      types.forEach(function (t) { seg.appendChild(h('button', { type: 'button', class: t === type ? 'on' : '', onclick: function () { type = t; draw(); } }, TXN_TYPES[t])); });
      catField.classList.toggle('hidden', type !== 'expense');
      empField.classList.toggle('hidden', type !== 'advance');
      desc.placeholder = type === 'withdraw' ? 'Vd: Chủ quán lấy' : type === 'refund' ? 'Vd: Khách CK dư 200k lấy tiền mặt' : type === 'advance' ? 'Vd: Ứng lương' : 'Vd: Mua bánh mì';
      hint();
    }
    function hint() {
      clear(warn);
      var a = amount.get() || 0;
      if (type === 'expense' && a >= d.limits.expenseApproval) warn.appendChild(h('div', { class: 'alert warn' }, 'Khoản chi từ ' + money(d.limits.expenseApproval) + ' đ cần trưởng ca/chủ quán duyệt (CB-13).'));
      if (type === 'advance' && emp.value) {
        var e = d.employees.filter(function (x) { return x.EmployeeID === emp.value; })[0];
        empInfo.textContent = 'Đã ứng tháng này: ' + money(e.advanceMonth) + ' đ · hạn mức ' + money(d.limits.advanceLimit) + ' đ';
        if (e.advanceMonth + a > d.limits.advanceLimit) warn.appendChild(h('div', { class: 'alert warn' }, 'Vượt hạn mức ứng lương tháng (CB-14); chủ quán sẽ được báo.'));
      } else empInfo.textContent = '';
    }
    emp.onchange = hint;
    draw();
    var body = h('div', null, seg, catField, empField, empInfo, UI.field('Số tiền', amount.el), UI.field('Nội dung (bắt buộc)', desc),
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn small', onclick: function () {
        UI.pickImage().then(function (data) {
          if (!data) return; imgLbl.textContent = 'Đang tải ảnh…';
          call('uploadImage', { dataUrl: data, name: 'HD' }).then(function (r) { img = r ? r.url : ''; imgLbl.textContent = r ? 'Đã đính kèm' : ''; });
        });
      } }, '📷 Ảnh hóa đơn'), imgLbl), warn, err);
    return UI.modal('Thêm giao dịch tiền mặt', body, [{ label: 'Hủy', value: null }, { label: 'Thêm', primary: true,
      validate: function () {
        var e = [];
        if (!(amount.get() > 0)) e.push('Nhập số tiền');
        if (!desc.value.trim()) e.push('Nhập nội dung');
        if (type === 'expense' && !cat.value) e.push('Chọn nhóm chi');
        if (type === 'advance' && !emp.value) e.push('Chọn nhân viên');
        err.textContent = e.join('\n');
        return !e.length;
      },
      value: function () { return { TxnType: type, CategoryID: type === 'expense' ? cat.value : '', EmployeeID: type === 'advance' ? emp.value : '', Amount: amount.get(), Description: desc.value.trim(), ReceiptImage: img }; } }]);
  }

  /* ---------- Chi tiết báo cáo (dùng chung M09, M10, W02) ---------- */
  function reportDetail(r, opts) {

          h('div', { class: 'right' }, h('div', { class: 'a' }, money(t.Amount)),

            opts.onAdjustTxn ? h('button', { class: 'linkish small', onclick: function () { opts.onAdjustTxn(t); } }, 'Điều chỉnh') : null)));
      })) : h('div', { class: 'muted small' }, 'Không có.'));

  function viewReportView(id) {

  /* ---------- M08 Nhận ca ---------- */
  function viewHandover(q) {
    var body = page('home', 'Nhận ca', '#/home');
    call('pendingHandovers').then(function (list) {
      if (!list) return;
      clear(body);
      if (!list.length) { body.appendChild(UI.empty('Không có két nào chờ nhận.')); return; }
      var r = list.filter(function (x) { return x.ReportID === q.id; })[0] || list[0];
      if (list.length > 1) body.appendChild(h('div', { class: 'seg' }, list.map(function (x) {
        return h('button', { class: x.ReportID === r.ReportID ? 'on' : '', onclick: function () { go('#/handover?id=' + x.ReportID); } }, x.CheckpointName + ' ' + fmtDateVN(x.BusinessDate).slice(0, 5));
      })));
      body.appendChild(h('div', { class: 'status-card' }, h('div', { class: 'big' }, r.ReporterName + ' giao két'),
        h('div', { class: 'muted' }, 'Mốc ' + r.CheckpointName + ' · ' + fmtDateVN(r.BusinessDate) + ' · gửi lúc ' + String(r.SubmittedTime).slice(11, 16))));
      var counted = UI.moneyInput();
      var extra = h('div');
      var reason = h('textarea', { rows: 2 });
      var btn = h('button', { class: 'btn primary block big' }, 'Xác nhận nhận ca');
      body.appendChild(h('div', { class: 'card' }, UI.field('Tiền tôi đếm được', counted.el),
        h('div', { class: 'small muted' }, 'Hãy tự đếm két. Số người giao khai chỉ hiện sau khi bạn nhập số của mình.'), extra));
      body.appendChild(btn);
      var needReason = false;
      function submit(confirmWarnings) {
        if (counted.get() === '') { UI.toast('Nhập số tiền bạn đếm được', 'err'); return; }
        if (needReason && !reason.value.trim()) { UI.toast('Nhập lý do chênh lệch', 'err'); return; }
        btn.disabled = true;
        call('receiveHandover', { reportId: r.ReportID, cashCounted: counted.get(), reason: reason.value, confirmWarnings: confirmWarnings }).then(function (res) {
          btn.disabled = false;
          if (!res) return;
          if (res.needReason) {
            needReason = true;
            clear(extra);
            extra.appendChild(h('div', { class: 'alert warn' }, h('strong', null, 'Lệch ' + money(res.diff) + ' đ'), h('div', null, res.reporterName + ' khai ' + money(res.reporterCount) + ' đ')));
            extra.appendChild(UI.field('Lý do chênh lệch (bắt buộc)', reason));
            reason.focus();
            return;
          }
          if (res.needConfirm) {
            UI.confirmBox('Kiểm tra lại số tiền', res.warnings.map(function (w) { return '⚠ ' + w.text; }), 'Vẫn xác nhận').then(function (ok) { if (ok) submit(true); });
            return;
          }
          UI.toast(res.diff ? 'Đã nhận ca, chênh lệch đã được ghi lại' : 'Đã nhận ca, két khớp');
          go('#/home');

  /* ---------- M09 Báo cáo của tôi ---------- */
  function viewMyReports(q) {

      body.appendChild(h('div', { class: 'row' }, h('div', { class: 'grow' }, UI.field('Tháng', mInput)), user().IsCashier ? h('a', { class: 'btn primary', href: '#/report' }, '+ Lập báo cáo') : null));
      if (!list.length) { body.appendChild(UI.empty('Chưa có báo cáo trong tháng.')); return; }
      body.appendChild(h('div', { class: 'card' }, h('ul', { class: 'list' }, list.map(function (r) {
        return h('li', { class: 'click', onclick: function () { go('#/report-view/' + r.ReportID); } },
          h('div', { class: 'row between' }, h('strong', null, r.CheckpointName + ' · ' + fmtDateVN(r.BusinessDate)), UI.badge(r.Status, r.StatusName)),
          h('div', { class: 'small muted' }, 'Két ' + money(r.CashCounted) + ' đ' + (r.IsOpening ? '' : ' · CK ' + money(r.TransferAmount) + ' đ') + ' · ' + r.txns.length + ' giao dịch' +
            (r.ReceiverID === user().EmployeeID ? ' · bạn nhận ca' : '')));
      }))));
    });
  }

  /* ---------- M10 + M11 Duyệt ---------- */
  function viewReview(q) {
    var tab = q.tab || 'reports';
    var body = page('review', 'Duyệt');
    var seg = h('div', { class: 'seg' },
      h('button', { class: tab === 'reports' ? 'on' : '', onclick: function () { go('#/review'); } }, 'Báo cáo ca'),
      h('button', { class: tab === 'att' ? 'on' : '', onclick: function () { go('#/review?tab=att'); } }, 'Chấm công'));

      call('pendingReports').then(function (list) {
        if (!list) return;
        clear(body); body.appendChild(seg);
        if (!list.length) { body.appendChild(UI.empty('Không có báo cáo chờ duyệt.')); return; }

          var flag = r.pendingTxns || r.Difference || r.HandoverDifference;
          return h('li', { class: 'click', onclick: function () { go('#/report-view/' + r.ReportID); } },
            h('div', { class: 'row between' }, h('strong', null, r.CheckpointName + ' · ' + fmtDateVN(r.BusinessDate)), flag ? UI.badge('pending', 'Cần xem') : UI.badge(r.Status, r.StatusName)),
            h('div', { class: 'small muted' }, r.ReporterName + ' · két ' + money(r.CashCounted) + ' đ' + (r.IsOpening ? '' : ' · CK ' + money(r.TransferAmount) + ' đ') +
              (r.pendingTxns ? ' · ' + r.pendingTxns + ' khoản chờ duyệt' : '') + (r.Difference ? ' · lệch đầu ngày ' + money(r.Difference) : '') + (r.HandoverDifference ? ' · lệch bàn giao ' + money(r.HandoverDifference) : '')));

            a.RequestReason ? h('div', { class: 'small' }, 'Lý do: ' + a.RequestReason) : null,
            a.Note ? h('div', { class: 'small muted' }, a.Note) : null,

              a.CheckOutTime && a.CheckInTime ? h('button', { class: 'btn small primary', onclick: function () { call('approveAttendance', { attendanceId: a.AttendanceID }).then(function (x) { if (x) { UI.toast('Đã duyệt'); render(); } }); } }, 'Duyệt') : null,
              h('button', { class: 'btn small', onclick: function () { editAttModal(a); } }, 'Sửa giờ'),
              h('button', { class: 'btn small', onclick: function () {

              } }, 'Từ chối')));
        }))));
      });
    }
  }

  function editAttModal(a) {
    var tin = h('input', { type: 'time', value: a.CheckInTime ? String(a.CheckInTime).slice(11, 16) : '' });
    var tout = h('input', { type: 'time', value: a.CheckOutTime ? String(a.CheckOutTime).slice(11, 16) : '' });
    var reason = h('input', { type: 'text', placeholder: 'Vd: quên bấm ra ca, xác nhận với camera' });
    var err = h('div', { class: 'field-err' });
    UI.modal('Sửa giờ – ' + a.EmployeeName + ' ' + fmtDateVN(a.BusinessDate), h('div', null,
      h('div', { class: 'row' }, h('div', { class: 'grow' }, UI.field('Giờ vào', tin)), h('div', { class: 'grow' }, UI.field('Giờ ra', tout))), UI.field('Lý do (bắt buộc)', reason), err),
      [{ label: 'Hủy', value: null }, { label: 'Lưu', primary: true, value: true, validate: function () { if (!tin.value || !tout.value || !reason.value.trim()) { err.textContent = 'Nhập đủ giờ vào, giờ ra và lý do'; return false; } return true; } }])

  /* ---------- Tài khoản ---------- */

    body.appendChild(h('div', { class: 'card tint' }, h('h3', null, 'Cài lên màn hình chính'),
      h('p', { class: 'small' }, 'Android (Chrome): bấm ⋮ → "Thêm vào màn hình chính".'),

      Api.call('logout').then(function () { setSession(null); go('#/login'); });

  }

  /* ---------- Bộ định tuyến ---------- */
  function render() {
    var r = parseHash(), p = r.parts, u = user();
    if (p[0] === 'login' || !u) { if (u && p[0] === 'login') return go('#/home'); return viewLogin(); }
    if (p[0] === 'change-pin') return viewChangePin();
    if (u.MustChange) return go('#/change-pin');
    switch (p[0]) {
      case undefined: case 'home': return viewHome();
      case 'checkin': return viewCheckin();
      case 'my-attendance': return viewMyAttendance(r.q);
      case 'attendance-request': return viewAttendanceRequest();
      case 'report': return viewReport(r.q);
      case 'report-view': return viewReportView(p[1]);
      case 'handover': return viewHandover(r.q);
      case 'my-reports': return viewMyReports(r.q);
      case 'review': return isLeader() ? viewReview(r.q) : go('#/home');
      case 'account': return viewAccount();
      case 'admin': return isAdmin() && window.Admin ? Admin.render(p.slice(1), r.q) : go('#/home');
      default: return go('#/home');
    }
  }

  window.App = {
    refresh: render, go: go, call: call, user: user, reportDetail: reportDetail, topbar: topbar, levelClass: levelClass, openRecord: openRecord, clear: clear
  };
  window.addEventListener('hashchange', render);
  call('config').then(function (c) { if (c) { window.STORE_NAME = c.storeName; window.STORE_ADDRESS = c.storeAddress; document.title = c.storeName; } render(); });
})();

(function () {

  var MENU = [

  /* ---- W07 Quỹ & ứng lương ---- */

  /* ---- W08 Cảnh báo ---- */

  /* ---- Nhập dữ liệu Excel (mục 5.3) ---- */
  function viewImport() {
    var body = layout('import', 'Nhập dữ liệu Excel cũ');
